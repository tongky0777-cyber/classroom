<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>김병진수학연구소 클래스</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a0e13">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="./grader.js"></script>
<style>
  :root{
    --bg:#0a0e13; --bg2:#0d1117; --surface:#13181f; --surface2:#1a212b;
    --bd:#222b38; --bd2:#2a3340;
    --teal:#1f6f5c; --teal-l:#4fb286; --teal-bg:#10241b; --teal-bd:#1d4535;
    --blue:#5b9ae0; --blue-bg:#0f1d2e; --blue-bd:#1c3148;
    --red:#e07a86; --red-bg:#241317; --red-bd:#4a2128;
    --gold:#d2a64a; --gold-bg:#241f12; --gold-bd:#46390f;
    --ink:#f0f3f7; --muted:#8a96a6; --muted2:#6b7686; --ink2:#cdd5e0;
    --gold-soft:#241f12; --cream:#13181f; --cream2:#1a212b; --line:#222b38; --deep:#0a0e13;
    --sans:'Pretendard','Apple SD Gothic Neo',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:74px;}
  input,textarea,select{color:var(--ink);background:var(--bg2);}
  input::placeholder,textarea::placeholder{color:var(--muted2);}
  /* 헤더 */
  .top{position:sticky;top:0;z-index:50;background:var(--bg2);color:var(--ink);padding:15px 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);}
  .top .ti{font-size:16px;font-weight:700;letter-spacing:-.3px;}
  .top .ti .mark{display:inline-block;width:8px;height:8px;background:var(--gold);border-radius:50%;margin-right:7px;}
  .top .who{font-size:12px;color:var(--muted);}
  .top .who b{color:var(--ink);font-weight:600;}
  .logout{background:var(--surface2);color:var(--muted);border:1px solid var(--bd);border-radius:20px;padding:6px 13px;font-size:12px;cursor:pointer;font-family:var(--sans);}
  /* 반 선택 바 */
  .classbar{background:var(--bg2);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;gap:8px;overflow-x:auto;align-items:center;}
  .classbar::-webkit-scrollbar{display:none;}
  .class-chip{flex-shrink:0;background:var(--surface);border:1px solid var(--bd2);border-radius:30px;padding:8px 16px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;transition:.2s;white-space:nowrap;}
  .class-chip.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .wrap{max-width:680px;margin:0 auto;padding:16px 14px;}
  /* 하단 탭바 */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:var(--bg2);border-top:1px solid var(--bd);}
  .tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 11px;cursor:pointer;color:var(--muted2);transition:.15s;}
  .tabbar .tb .tbi{font-size:21px;line-height:1;}
  .tabbar .tb .tbl{font-size:10px;font-weight:500;}
  .tabbar .tb.on{color:var(--blue);}
  .tabbar .tb.on .tbi{transform:translateY(-1px);}
  /* 기존 .vtabs/.vtab 은 안 쓰지만 호환용으로 숨김 */
  .vtabs{display:none;}
  /* 카드 공통 */
  .post{background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px;}
  .post-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
  .avatar.teacher{background:var(--gold);color:#1a1206;}
  .post-meta{flex:1;min-width:0;}
  .post-meta .nm{font-size:14px;font-weight:500;color:var(--ink);}
  .post-meta .tm{font-size:11.5px;color:var(--muted);}
  .post-body{font-size:14.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--ink);}
  .post-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .post-imgs img{width:84px;height:84px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--bd);}
  .post-file{display:inline-flex;align-items:center;gap:7px;margin-top:10px;background:var(--surface2);border:1px solid var(--bd);border-radius:8px;padding:9px 13px;font-size:13px;color:var(--ink);text-decoration:none;font-weight:500;}
  .badge{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;}
  .badge.q{background:var(--gold-bg);color:var(--gold);}
  .badge.done{background:var(--teal-bg);color:var(--teal-l);}
  .badge.wait{background:var(--red-bg);color:var(--red);}
  /* 답변 */
  .answer{margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd2);}
  .answer .alabel{font-size:12px;font-weight:500;color:var(--teal-l);margin-bottom:7px;display:flex;align-items:center;gap:5px;}
  /* 작성 영역 */
  .composer{background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:16px;}
  .composer textarea{width:100%;background:var(--bg2);border:1px solid var(--bd2);border-radius:10px;padding:12px;font-size:14.5px;font-family:var(--sans);resize:vertical;min-height:70px;color:var(--ink);}
  .composer textarea:focus{outline:none;border-color:var(--teal-l);}
  .comp-actions{display:flex;gap:8px;margin-top:10px;align-items:center;}
  .icon-btn{background:var(--surface2);border:1px solid var(--bd);border-radius:9px;padding:9px 13px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--sans);color:var(--ink);}
  .send-btn{margin-left:auto;background:var(--teal);color:#fff;border:none;border-radius:30px;padding:10px 22px;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--sans);}
  .send-btn:disabled{opacity:.5;}
  .preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .preview .pv{position:relative;}
  .preview img{width:64px;height:64px;object-fit:cover;border-radius:8px;}
  .preview .del{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1;}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:50px 20px;}
  /* 모달 */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .modal.on{display:flex;}
  .modal-box{background:var(--surface);border:1px solid var(--bd);border-radius:16px;padding:24px;max-width:400px;width:100%;max-height:85vh;overflow-y:auto;color:var(--ink);}
  .modal-box h3{font-size:18px;font-weight:500;margin-bottom:16px;}
  .modal-photo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;align-items:center;justify-content:center;padding:0;overflow:auto;-webkit-overflow-scrolling:touch;}
  .modal-photo.on{display:flex;}
  .modal-photo img{max-width:100%;max-height:100vh;object-fit:contain;cursor:zoom-in;display:block;margin:auto;}
  .modal-photo.zoomed{align-items:flex-start;justify-content:flex-start;}
  .modal-photo.zoomed img{max-width:none;max-height:none;width:200%;height:auto;object-fit:fill;cursor:zoom-out;margin:0;}
  .modal-photo .close-x{position:fixed;top:14px;right:18px;color:#fff;font-size:34px;line-height:1;cursor:pointer;z-index:201;text-shadow:0 1px 4px rgba(0,0,0,.6);}
  .modal-photo .zoom-hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:12px;opacity:.75;z-index:201;pointer-events:none;}
  /* 관리자 */
  .adm-section{background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;}
  .adm-section h3{font-size:15px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;color:var(--ink);}
  .mini-btn{background:var(--teal);color:#fff;border:none;border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:var(--sans);}
  .stu-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);}
  .stu-row:last-child{border-bottom:none;}
  .stu-row .nm{font-size:14px;font-weight:500;flex:1;color:var(--ink);}
  .stu-row .tag{font-size:11px;color:var(--muted);}
  .chk{width:20px;height:20px;}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--ink);border:1px solid var(--bd2);padding:12px 22px;border-radius:30px;font-size:13.5px;font-weight:500;z-index:300;opacity:0;transition:.3s;pointer-events:none;}
  .toast.on{opacity:1;}
  input[type=text],input[type=password],select{font-family:var(--sans);}
  .fld{width:100%;background:var(--bg2);border:1px solid var(--bd2);border-radius:10px;padding:12px;font-size:15px;margin-bottom:12px;color:var(--ink);}
  .fld:focus{outline:none;border-color:var(--teal-l);}
  /* 홈 대시보드 */
  .home-hello{padding:4px 2px 14px;}
  .home-hello .greet{font-size:19px;font-weight:500;color:var(--ink);}
  .home-hello .sub{font-size:12px;color:var(--muted);margin-top:3px;}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:18px;}
  .stat-card{border-radius:14px;padding:14px;border:1px solid var(--bd);background:var(--surface);}
  .stat-card .lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;}
  .stat-card .num{font-size:26px;font-weight:500;color:var(--ink);margin-top:8px;line-height:1.1;}
  .stat-card .cap{font-size:11px;color:var(--muted);margin-top:3px;}
  .stat-card.blue{background:var(--blue-bg);border-color:var(--blue-bd);} .stat-card.blue .lbl{color:var(--blue);}
  .stat-card.red{background:var(--red-bg);border-color:var(--red-bd);} .stat-card.red .lbl{color:var(--red);}
  .stat-card.teal{background:var(--teal-bg);border-color:var(--teal-bd);} .stat-card.teal .lbl{color:var(--teal-l);}
  .stat-card.gold{background:var(--gold-bg);border-color:var(--gold-bd);} .stat-card.gold .lbl{color:var(--gold);}
  .sec-title{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px;}
  .sec-title .t{font-size:15px;font-weight:500;color:var(--ink);}
  .sec-title .more{font-size:12px;color:var(--blue);cursor:pointer;}
</style>
</head>
<body>
<div class="top">
  <div class="ti"><span class="mark"></span>김병진수학연구소<span style="font-size:12px;font-weight:500;color:var(--muted);margin-left:6px;">클래스</span></div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="who"><b id="who-name"></b> <span id="who-role"></span> <a id="who-grade-edit" onclick="editMyGrade()" style="display:none;font-size:11px;color:rgba(255,255,255,.8);text-decoration:underline;cursor:pointer;margin-left:4px;"></a></span>
    <button id="notify-btn" class="logout" style="display:none;">🔔 알림 켜기</button>
    <button class="logout" onclick="doLogout()">로그아웃</button>
  </div>
</div>

<div class="classbar" id="classbar"></div>

<div id="ddaybar" style="display:none;"></div>

<div class="wrap" id="main"></div>

<div class="tabbar" id="tabbar"></div>

<!-- 사진 크게보기 -->
<div class="modal-photo" id="photoModal" onclick="closePhoto()">

</div>

<!-- 범용 모달 -->
<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

var TELEGRAM_NOTIFY_ENDPOINT = "https://kimbjmath-dashboard.vercel.app/api/telegram";
var CLASSROOM_AUTH_ENDPOINT = "https://kimbjmath-dashboard.vercel.app/api/classroom-auth";

function notifyTelegram(text, bubbleError){
  try{
    if(!TELEGRAM_NOTIFY_ENDPOINT) return Promise.resolve({ok:false});
    return fetch(TELEGRAM_NOTIFY_ENDPOINT, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ text:text })
    }).then(function(res){
      if(!res.ok) throw new Error('telegram failed');
      return res.json().catch(function(){ return {ok:true}; });
    }).catch(function(err){
      if(bubbleError) throw err;
      return {ok:false};
    });
  }catch(e){
    if(bubbleError) return Promise.reject(e);
    return Promise.resolve({ok:false});
  }
}

function sendTelegramTest(){
  if(!isAdmin){ toast('선생님/조교만 테스트할 수 있어요'); return; }
  var btn=document.getElementById('telegram-test-btn');
  if(btn) btn.disabled=true;
  var role = isFullAdmin ? '선생님' : '조교';
  var cls = CURRENT_CLASS && CLASSES[CURRENT_CLASS] ? '\n반: '+CLASSES[CURRENT_CLASS].name : '';
  var msg = '🔔 텔레그램 알림 테스트\n'+MY_NAME+' '+role+' 계정에서 보낸 테스트입니다.'+cls+'\n'+new Date().toLocaleString();
  notifyTelegram(msg, true).then(function(){
    toast('텔레그램 테스트 알림을 보냈어요');
  }).catch(function(){
    toast('텔레그램 알림 실패. 환경변수와 재배포를 확인해 주세요');
  }).then(function(){
    if(btn) btn.disabled=false;
  });
}

function classroomPushAction(action, data){
  var token=localStorage.getItem('class_admin_token');
  if(!isAdmin || !token) return Promise.reject(new Error('staff token required'));
  var body=Object.assign({action:action, token:token, prefix:CLS_PREFIX}, data||{});
  return fetch(CLASSROOM_PUSH_ENDPOINT, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(res){
    if(!res.ok) throw new Error('push failed');
    return res.json();
  }).then(function(r){
    if(!r || !r.ok) throw new Error((r&&r.error)||'push failed');
    return r;
  });
}

function clearClassSession(){
  ['class_uid','class_name','class_role','class_namekey','class_admin_token'].forEach(function(k){localStorage.removeItem(k);});
}
function verifyAdminSession(cb){
  if(!isAdmin){ cb(); return; }
  var token=localStorage.getItem('class_admin_token');
  if(!token){ clearClassSession(); location.href='index.html'; return; }
  fetch(CLASSROOM_AUTH_ENDPOINT, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'verify', token:token})
  }).then(function(res){
    if(!res.ok) throw new Error('verify failed');
    return res.json();
  }).then(function(r){
    if(!r || !r.ok || r.role!==MY_ROLE) throw new Error('verify failed');
    if(r.name) localStorage.setItem('class_name', r.name);
    if(r.key) localStorage.setItem('class_namekey', r.key);
    cb();
  }).catch(function(){
    clearClassSession();
    location.href='index.html';
  });
}
function verifyStudentSession(cb){
  if(isAdmin){ cb(); return; }
  if(!MY_KEY || !UID){ clearClassSession(); location.href='index.html'; return; }
  db.ref(CP('class_users/')+MY_KEY).once('value').then(function(snap){
    var u=snap.val();
    if(!u || String(u.uid)!==String(UID) || (u.role && u.role!=='student')){
      clearClassSession();
      location.href='index.html';
      return;
    }
    if(u.name && u.name!==MY_NAME){
      MY_NAME=u.name;
      localStorage.setItem('class_name', u.name);
      document.getElementById('who-name').textContent = u.name;
    }
    if(cb) cb();
  }).catch(function(){
    clearClassSession();
    location.href='index.html';
  });
}
function requireStudentSession(){
  if(isAdmin) return false;
  if(!MY_KEY || !UID){
    clearClassSession();
    location.href='index.html';
    return false;
  }
  return true;
}
function classroomAdminAction(action, data){
  var token=localStorage.getItem('class_admin_token');
  if(!isAdmin || !token){
    toast('선생님 권한 확인이 필요해요');
    return Promise.reject(new Error('admin token required'));
  }
  var body=Object.assign({action:action, token:token, prefix:CLS_PREFIX}, data||{});
  return fetch(CLASSROOM_ADMIN_ENDPOINT, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(res){
    if(!res.ok) throw new Error('admin action failed');
    return res.json();
  }).then(function(r){
    if(!r || !r.ok) throw new Error((r&&r.error)||'admin action failed');
    return r;
  });
}

  if(isAdmin) return;
  if(!requireStudentSession()) return;
  var cur = MY_GRADE || '';

    var el=document.getElementById('who-grade-edit');
    if(el) el.textContent = g+' ✎';

  }).catch(function(){ toast('수정 실패. 다시 시도해 주세요'); });
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function initial(name){ return (name||'?').trim().charAt(0); }
function fmtTime(iso){
  if(!iso) return '';
  var d=new Date(iso), now=new Date();
  var sameDay=d.toDateString()===now.toDateString();
  var hh=('0'+d.getHours()).slice(-2), mm=('0'+d.getMinutes()).slice(-2);
  if(sameDay) return '오늘 '+hh+':'+mm;
  return (d.getMonth()+1)+'/'+d.getDate()+' '+hh+':'+mm;
}

// 사진 압축 (손글씨가 선명하게 보이도록 해상도·품질 상향)
function compressImage(file, cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var max=1600, w=img.width, h=img.height;
      if(w>h){ if(w>max){ h=h*max/w; w=max; } }
      else { if(h>max){ w=w*max/h; h=max; } }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.82));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

var TEST_LIST = [];    // 대시보드 시험 점수 (bjm_tests) — 선생님이 입력한 테스트 결과

var _hwListenersOn=false;   // 실시간 리스너 중복 등록 방지
var _hwReadyCount=0;        // 최초 4개 노드 도착 여부
var _hwInitCb=null;         // 최초 로드 완료 콜백

// 데이터가 바뀌면 호출: 숙제 풀이 입력 중이 아닐 때, 숙제/홈 탭을 보고 있으면 자동 갱신
function onHwDataChange(){
  if(_hwReadyCount<4) return;          // 최초 로드 전에는 자동 갱신 안 함
  if(_aioSubmitting) return;           // 제출 처리 중에는 건드리지 않음
  if(document.getElementById('aio-qlist')) return; // 문제 풀이 화면이 열려 있으면 방해 안 함
  if(CUR_TAB==='hw' || CUR_TAB==='home'){
    var sid=mySid();
    if(sid) loadMyWrongSubs(renderMain); else renderMain();
  }
}

function loadHomework(cb){
  // 이미 실시간 리스너가 켜져 있으면: 데이터는 항상 최신이므로 바로 콜백
  if(_hwListenersOn){
    if(_hwReadyCount>=4){ var sid=mySid(); if(sid) loadMyWrongSubs(cb); else if(cb) cb(); }
    else { _hwInitCb=cb; }
    return;
  }
  _hwListenersOn=true; _hwReadyCount=0; _hwInitCb=cb;
  function ready(){
    if(_hwReadyCount<4){
      _hwReadyCount++;
      if(_hwReadyCount===4){ var sid=mySid(); var done=_hwInitCb; _hwInitCb=null;
        if(sid) loadMyWrongSubs(done); else if(done) done(); }
    } else {
      onHwDataChange();   // 최초 로드 이후의 변경 → 자동 갱신
    }
  }
  try{
    db.ref('bjm_homework').on('value', function(s){ var v=s.val(); HW_LIST = v? (Array.isArray(v)?v:Object.values(v)) : []; ready(); }, function(){ ready(); });
    db.ref('bjm_students').on('value', function(s){ var v=s.val(); HW_STUDENTS = v? (Array.isArray(v)?v:Object.values(v)) : []; ready(); }, function(){ ready(); });
    db.ref(CP('class_hw_done')).on('value', function(s){ HW_DONE = s.val()||{}; ready(); }, function(){ ready(); });
    db.ref('bjm_tests').on('value', function(s){ var v=s.val(); TEST_LIST = v? (Array.isArray(v)?v:Object.values(v)) : []; ready(); }, function(){ ready(); });
  }catch(e){ if(cb) cb(); }
}

// 시험 레코드 → 표시 라벨 (대시보드 getPaperKey 규칙과 동일)
function testLabel(t){
  var name=t.name||'';
  if(name==='미니모의고사'){ return [t.miniTarget, '미니모의고사', t.week].filter(Boolean).join(' '); }
  if(name==='기출 Test'){ return [t.examYear,t.examSchool,t.examSubject,t.examTerm2,(t.examTerm?t.examTerm+'고사':'')].filter(Boolean).join(' ')||'기출 Test'; }
  if(name==='모의고사 기출'){ return [t.examYear,t.mockRound].filter(Boolean).join(' ')+' 모의고사 기출'; }
  return name+(t.unit?' · '+t.unit:'');
}
// 내 시험 점수 (채점 완료된 것만, 최근순)
function myTestScores(){
  var sid=mySid();
  if(!sid) return [];
  return TEST_LIST.filter(function(t){
    return t && t.sid===sid && !t.pending && t.score!=null;
  }).sort(function(a,b){
    return (b.date||'').localeCompare(a.date||'') || (b.id||'').localeCompare(a.id||'');
  });
}
// 점수대별 색상 (대시보드 난이도 기준: 초록90↑/노랑70↑/빨강70↓)
function scoreColor(pct){ return pct>=90?'#4fb286':pct>=70?'#d2a64a':'#e07a86'; }
function scoreBarColor(pct){ return pct>=90?'#1f6f5c':pct>=70?'#d2a64a':'#e07a86'; }
function scoreBg(pct){ return pct>=90?'#0d2118':pct>=70?'#1c1505':'#1f0e10'; }

var _wrongListenersOn={};   // {hwId:true} 중복 등록 방지
// 올인원 자동채점 숙제에 대한 내 제출 기록 로드 (mySid 기준) — 실시간
function loadMyWrongSubs(cb){
  var sid=mySid();
  var aioHw=HW_LIST.filter(function(h){ return _isAioHw(h) && hwForSid(h, sid); });
  if(!sid || !aioHw.length){ if(cb) cb(); return; }
  var pending=aioHw.filter(function(h){ return !_wrongListenersOn[h.id]; });
  if(!pending.length){ if(cb) cb(); return; }  // 이미 다 구독 중이면 최신값 보유
  var left=pending.length;
  pending.forEach(function(h){
    _wrongListenersOn[h.id]=true;
    var first=true;
    db.ref('wronganswers/'+h.id+'/'+sid).on('value', function(s){
      WRONG_SUBS[h.id]=s.val()||null;
      if(first){ first=false; if(--left<=0 && cb) cb(); }
      else { onHwDataChange(); }   // 이후 변경(선생님 채점 등) → 자동 갱신
    }, function(){ if(first){ first=false; if(--left<=0 && cb) cb(); } });
  });
}

// 내 classKey에 연결된 대시보드 학생 id 찾기
function mySid(){
  if(!requireStudentSession()) return null;
  var me = HW_STUDENTS.find(function(st){ return st.classKey===MY_KEY; });
  return me ? me.id : null;
}
// classKey로 학생 id
function sidOfClassKey(key){
  var st = HW_STUDENTS.find(function(s){ return s.classKey===key; });
  return st? st.id : null;
}

// 이 학생(sid)에게 해당하는 숙제인지 (개인 숙제 sid 일치 OR 반 숙제 gid가 학생 반)
function hwForSid(h, sid){
  if(!sid) return false;
  if(h.sid && h.sid===sid) return true;
  return false;
}

function isHwDone(hwId, key){
  // 1) 학생이 클래스룸에서 직접 체크한 경우
  if(HW_DONE[hwId] && HW_DONE[hwId][key] && HW_DONE[hwId][key].done) return true;
  // 2) 선생님이 대시보드에서 '제출 완료'로 바꾼 경우
  var h = HW_LIST.find(function(x){ return x.id===hwId; });
  if(h && h.status==='done') return true;
  return false;
}
// 학생이 직접 체크했는지만 (완료 취소 버튼 표시용)
function isHwCheckedByStudent(hwId, key){
  return !!(HW_DONE[hwId] && HW_DONE[hwId][key] && HW_DONE[hwId][key].done);
}

// ===== [오답수집] 올인원 자동채점 숙제 통합 =====
var AIO_BOOK_NAME='All in one 공수1';
var AIO_BOOKS={
  "All in one 공수1":{ tmKey:"올인원", units:{ unit1:"1단원 다항식", unit2:"2단원 나머지정리·인수분해", unit3:"3단원 방정식", unit_eq:"2권 방정식·일차부등식", unit_ineq:"2권 이차부등식·경우의 수", unit_perm:"2권 순열과 조합·행렬" } },
  "All in one 대수":{ tmKey:"올인원 대수", units:{ unit1_1:"1-1 지수 & 로그", unit1_2:"1-2 지수로그함수", unit2_1:"2-1 삼각함수" } },
  "Only one 공수1":{ tmKey:"온리원", units:{ unit1:"1단원 다항식", unit2_1:"2-1단원 복소수", unit2_2:"2-2단원 이차방정식과 이차함수", unit2_3:"2-3단원 여러 가지 방정식과 부등식" } },
  "All in one 미적분1":{ tmKey:"올인원 미적분", units:{ unit_limit:"극한과 연속", unit_diff:"미분계수와 도함수", unit_diffapp:"미분법의 활용(1)" } },
  "Only one 미적분1":{ tmKey:"온리원 미적분", units:{ unit_diff:"2권 도함수의 활용", unit_integ:"2권 적분" } },
  "Only one 공수2":{ tmKey:"온리원 공수2", units:{ unit_prop:"2권 명제", unit_func:"2권 함수(합성·역함수)", unit_ratirr:"2권 유리함수와 무리함수" } }
};
// 전 교재 단원명 통합 (레코드 표시용 — 키 충돌 시 부정확할 수 있어 fallback 전용)
var AIO_UNIT_NAMES=(function(){ var m={}; for(var b in AIO_BOOKS){ var u=AIO_BOOKS[b].units; for(var k in u) m[k]=u[k]; } return m; })();
// 교재를 함께 보고 단원명 결정 (unit2_1 같은 키가 교재 간 겹쳐도 정확)
function _aioUnitName(h){
  if(!h || !h.unitKey) return '';
  var b=AIO_BOOKS[_aioBookOf(h)];
  return (b && b.units[h.unitKey]) || AIO_UNIT_NAMES[h.unitKey] || h.unitKey;
}
function _aioBookOf(h){ return (h && AIO_BOOKS[h.book]) ? h.book : 'All in one 공수1'; }
function _aioTmKeyOf(h){ return AIO_BOOKS[_aioBookOf(h)].tmKey; }
var _aioAK=null;          // 현재 풀이 중인 교재 정답표 (활성)
var _aioAKCache={};       // tmKey → 정답표 캐시
var WRONG_SUBS={};        // {hwId: submission}  내 제출 캐시
function _isAioHw(h){ return h && AIO_BOOKS[h.book] && h.unitKey && h.qStart!=null && h.qEnd!=null; }

// ===== 오늘의 문제 (학생) =====
var DAILY_PROBS = [];   // bjm_daily_problems
var DAILY_SUBS = {};    // bjm_daily_subs {probId:{sid:{answer,correct,at}}}
var _dailyListenersOn = false;

// 오늘의 문제: 학생이 답을 입력 중인지 확인 (입력 중이면 실시간 갱신으로 화면을 다시 그리지 않음)
function _dailyInputBusy(){
  var ae=document.activeElement;
  if(ae && /^daily-(short|mc)/.test(ae.id||'')) return true;           // 주관식 입력칸에 포커스
  var inputs=document.querySelectorAll('[id^="daily-short-"]');
  for(var i=0;i<inputs.length;i++){ if(inputs[i].value && inputs[i].value.trim()) return true; }  // 쓰다 만 답 있음
  var sid=mySid();
  for(var pid in _dailyMcPick){                                        // 객관식 골라두고 아직 제출 전
    if(!(DAILY_SUBS[pid] && sid && DAILY_SUBS[pid][sid])) return true;
  }
  return false;
}
function loadDaily(cb){
  if(_dailyListenersOn){ if(cb) cb(); return; }  _dailyListenersOn = true;
  var got=0; function ready(){ got++; if(got>=2 && cb){ cb(); cb=null; } if(got>2){ if(CUR_TAB==='daily' && !_dailyInputBusy()) renderMain(); } }
  try{
    db.ref('bjm_daily_problems').on('value', function(s){ var v=s.val(); DAILY_PROBS = v? (Array.isArray(v)?v.filter(Boolean):Object.values(v)) : []; ready(); }, function(){ ready(); });
    db.ref('bjm_daily_subs').on('value', function(s){ DAILY_SUBS = s.val()||{}; ready(); }, function(){ ready(); });
  }catch(e){ if(cb) cb(); }
}

// 정답 비교 (단답형은 공백 제거 후 비교)
function dailyIsCorrect(prob, answer){
  if(prob.type==='mc') return String(prob.answer)===String(answer);
  var norm=function(x){ return String(x||'').replace(/\s+/g,'').replace(/\s/g,''); };
  return norm(prob.answer)===norm(answer);
}

function renderDailyStudent(){
  var main=document.getElementById('main');
  var sid=mySid();
  // 최신 날짜순 정렬
  var probs=DAILY_PROBS.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  if(!probs.length){
    main.innerHTML='<div style="padding:40px 20px;text-align:center;color:var(--muted2);"><i class="ti ti-target" style="font-size:40px;opacity:.4;"></i><div style="margin-top:12px;font-size:14px;">아직 등록된 문제가 없어요.</div></div>';
    return;
  }
  // 날짜별 그룹
  var byDate={};
  probs.forEach(function(p){ (byDate[p.date]=byDate[p.date]||[]).push(p); });
  var dates=Object.keys(byDate).sort(function(a,b){ return b.localeCompare(a); });

  var html='<div style="padding:12px 14px 80px;">';
  html+='<div style="font-size:19px;font-weight:800;margin-bottom:4px;">🎯 오늘의 문제</div>';
  html+='<div style="font-size:12.5px;color:var(--muted2);margin-bottom:16px;">문제를 풀고 답을 제출하면 풀이를 볼 수 있어요.</div>';

  dates.forEach(function(date){
    html+='<div style="font-size:13px;font-weight:700;color:var(--blue);margin:14px 0 8px;">'+dailyDateLabel(date)+'</div>';
    byDate[date].forEach(function(p, i){
      var mine = sid && DAILY_SUBS[p.id] && DAILY_SUBS[p.id][sid];
      var solved = mine && mine.correct;
      html+='<div class="card" style="background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;">';
      html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">';
      if(p.tag) html+='<span style="font-size:11px;background:var(--teal);color:#fff;padding:2px 9px;border-radius:100px;">'+esc(p.tag)+'</span>';
      html+='<span style="font-size:11px;color:var(--muted2);">'+(p.type==='mc'?'객관식':'단답형')+'</span>';
      if(solved) html+='<span style="margin-left:auto;font-size:12px;color:var(--teal-l);font-weight:700;">✓ 해결</span>';
      html+='</div>';
      // 문제 이미지
      html+='<img src="'+p.imgQ+'" style="width:100%;border:1px solid var(--bd);border-radius:8px;cursor:zoom-in;" onclick="dailyZoom(\''+p.id+'\')">';
      // 답 입력/결과 영역
      html+='<div id="daily-ans-'+p.id+'" style="margin-top:12px;">';
      html+=dailyAnswerAreaHtml(p, mine);
      html+='</div>';
      html+='</div>';
    });
  });
  html+='</div>';
  main.innerHTML=html;
}

function dailyAnswerAreaHtml(p, mine){
  // 이미 정답 맞힌 경우 → 풀이 공개
  if(mine && mine.correct){
    return '<div style="background:var(--deep,#05221b);border:1px solid var(--teal);border-radius:8px;padding:10px;color:var(--teal-l);font-size:13px;font-weight:600;margin-bottom:8px;">✓ 정답이에요! 풀이를 확인하세요.</div>'
      + '<img src="'+p.imgA+'" style="width:100%;border:1px solid var(--bd);border-radius:8px;cursor:zoom-in;" onclick="dailyZoomA(\''+p.id+'\')">';
  }
  // 미해결 (틀린 적 있으면 안내 문구)
  var retryMsg = (mine && !mine.correct) ? '<div style="font-size:12.5px;color:#e0a04a;margin-bottom:8px;">다시 한번 고민해보세요 🤔</div>' : '';
  var input;
  if(p.type==='mc'){
    input='<div style="display:flex;gap:6px;flex-wrap:wrap;" id="daily-mc-'+p.id+'">';
    ['①','②','③','④','⑤'].forEach(function(sym,idx){
      input+='<button onclick="dailyPickMc(\''+p.id+'\','+(idx+1)+')" data-v="'+(idx+1)+'" class="daily-mc-btn" style="width:44px;height:44px;border-radius:10px;border:1.5px solid var(--bd);background:var(--bg2);color:var(--ink);font-size:17px;cursor:pointer;">'+sym+'</button>';
    });
    input+='</div>';
  } else {
    input='<input id="daily-short-'+p.id+'" placeholder="답 입력 (예: 12)" style="width:100%;background:var(--bg2);border:1.5px solid var(--bd);border-radius:10px;padding:12px;font-size:15px;color:var(--ink);">';
  }
  return retryMsg + input
    + '<button onclick="dailySubmit(\''+p.id+'\')" style="width:100%;margin-top:10px;height:44px;border-radius:10px;border:0;background:var(--teal);color:#fff;font-size:15px;font-weight:600;cursor:pointer;">제출하기</button>';
}

var _dailyMcPick = {};  // {probId:선택번호}
function dailyPickMc(pid, v){
  _dailyMcPick[pid]=v;
  var wrap=document.getElementById('daily-mc-'+pid); if(!wrap) return;
  wrap.querySelectorAll('.daily-mc-btn').forEach(function(b){
    var on=(+b.getAttribute('data-v')===v);
    b.style.border='1.5px solid '+(on?'var(--teal-l)':'var(--bd)');
    b.style.background=on?'var(--teal)':'var(--bg2)';
    b.style.color=on?'#fff':'var(--ink)';
  });
}

function dailySubmit(pid){
  if(!requireStudentSession()) return;
  var sid=mySid();
  if(!sid){ alert('학생 정보를 찾을 수 없어요. 선생님께 클래스룸 연결을 요청해주세요.'); return; }
  var prob=DAILY_PROBS.find(function(p){ return p.id===pid; });
  if(!prob) return;
  var answer;
  if(prob.type==='mc'){
    answer=_dailyMcPick[pid];
    if(!answer){ alert('답을 선택해주세요'); return; }
  } else {
    var el=document.getElementById('daily-short-'+pid);
    answer=el? el.value.trim() : '';
    if(!answer){ alert('답을 입력해주세요'); return; }
  }
  var correct=dailyIsCorrect(prob, answer);
  // 저장: 맞으면 확정 기록, 틀리면 마지막 시도만 기록(재시도 가능)
  var rec={ answer:String(answer), correct:correct, at:new Date().toISOString() };
  db.ref('bjm_daily_subs/'+pid+'/'+sid).set(rec).then(function(){
    delete _dailyMcPick[pid];
    DAILY_SUBS[pid]=DAILY_SUBS[pid]||{}; DAILY_SUBS[pid][sid]=rec;
    // 해당 문제 영역만 갱신
    var area=document.getElementById('daily-ans-'+pid);
    if(area) area.innerHTML=dailyAnswerAreaHtml(prob, rec);
    if(!correct){ /* 틀림: 안내는 area에 이미 반영됨 */ }
  }).catch(function(e){ alert('제출 중 오류가 났어요. 다시 시도해주세요.'); });
}

function dailyDateLabel(d){
  if(!d) return '';
  var parts=d.split('-'); if(parts.length<3) return d;
  var today=new Date().toISOString().slice(0,10);
  var suffix = (d===today)?' (오늘)':'';
  return parts[1]+'월 '+parts[2]+'일'+suffix;
}
function dailyZoom(pid){ var p=DAILY_PROBS.find(function(x){return x.id===pid;}); if(p) _openImgFull(p.imgQ); }
function dailyZoomA(pid){ var p=DAILY_PROBS.find(function(x){return x.id===pid;}); if(p) _openImgFull(p.imgA); }
function _openImgFull(src){ var w=window.open('','_blank'); if(w) w.document.write('<body style="margin:0;background:#000;"><img src="'+src+'" style="width:100%;"></body>'); }

// ===== 학생 홈 대시보드 =====
function renderHome(){
  var main=document.getElementById('main');
  var sid=mySid();
  var mine = sid ? HW_LIST.filter(function(h){ return hwForSid(h, sid); }) : [];
  var total=mine.length;
  var doneCnt=mine.filter(function(h){ return isHwDone(h.id, MY_KEY); }).length;
  var pct = total? Math.round(doneCnt/total*100):0;
  var waiting = mine.filter(function(h){ return !isHwDone(h.id, MY_KEY); });
  var today=todayStr();
  var tomorrow=new Date(Date.now()+86400000).toISOString().slice(0,10);
  var overdue = waiting.filter(function(h){ return h.due && h.due<today; }).length;
  var soon = waiting.filter(function(h){ return h.due && (h.due===today || h.due===tomorrow); }).length; // 오늘·내일 마감
  var waitCap = overdue ? ('마감 초과 '+overdue+'개')
              : soon ? ('오늘·내일 마감 '+soon+'개')
              : (waiting.length ? '여유 있어요' : '없어요');

  // 최근 시험 점수 (선생님이 대시보드에서 입력한 채점 완료 시험)
  var myTests = myTestScores();
  var recentTest = myTests[0] || null;
  var scoreTxt='-', scoreCap='시험 기록 없음', scoreNumColor='#f0f3f7';
  if(recentTest){

          +'<button class="send-btn" style="margin-top:10px;width:100%;margin-left:0;" onclick="setTab(\'hw\')">답 입력하고 채점받기</button></div>';

function renderHwStudent(){
  var main=document.getElementById('main');
  var sid = mySid();
  if(!sid){
    main.innerHTML += '<div class="empty">아직 선생님과 연결되지 않았어요.<br>선생님이 대시보드에서 계정을 연결하면<br>숙제가 여기 표시됩니다.</div>';
    return;
  }
  var mine = HW_LIST.filter(function(h){ return hwForSid(h, sid); });
  var doneCnt = mine.filter(function(h){ return isHwDone(h.id, MY_KEY); }).length;

  var html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'
    +'<span style="font-size:14px;font-weight:700;">받은 숙제</span>'
    +'<span style="font-size:13px;color:var(--teal);font-weight:700;">'+doneCnt+' / '+mine.length+' 완료</span></div>';

  if(!mine.length){ main.innerHTML += html + '<div class="empty">아직 받은 숙제가 없어요.</div>'; return; }

  var today = todayStr();
  // 마감일 최신순 (늦은 마감일이 맨 위, 오래된 것이 아래로)
  mine.sort(function(a,b){ return (b.due||'').localeCompare(a.due||''); });

  mine.forEach(function(h){
    var done = isHwDone(h.id, MY_KEY);
    var byStudent = isHwCheckedByStudent(h.id, MY_KEY);
    var info = [h.book, h.unit].filter(Boolean).join(' · ');
    var range = h.range||'';
    var overdue = h.due && h.due<today && !done;

    // ── 올인원 자동채점 숙제: 별도 카드 ──
    if(_isAioHw(h)){
      var sub=WRONG_SUBS[h.id];
      var uname=_aioUnitName(h);
      var title=_aioBookOf(h)+' '+uname+' '+h.qStart+'~'+h.qEnd+'번';
      if(sub && sub.submittedFull){
        var c=sub.counts||{};
        var wrongArr=(sub.wrong||[]).slice().sort(function(a,b){return a-b;});
        var pendArr=(sub.pending||[]).slice().sort(function(a,b){return a-b;});
        var detailHtml='';
        if(wrongArr.length || pendArr.length){
          detailHtml='<div id="wd-'+h.id+'" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">';
          if(wrongArr.length){
            detailHtml+='<div style="font-size:11px;color:var(--muted);margin-bottom:6px;">틀린 번호</div>'
              +'<div style="display:flex;flex-wrap:wrap;gap:6px;">'
              +wrongArr.map(function(n){ return '<span style="background:var(--red-bg);color:var(--red);font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;">'+n+'번</span>'; }).join('')
              +'</div>';
          }
          if(pendArr.length){
            detailHtml+='<div style="font-size:11px;color:var(--muted);margin:10px 0 6px;">직접 확인 (△)</div>'
              +'<div style="display:flex;flex-wrap:wrap;gap:6px;">'
              +pendArr.map(function(n){ return '<span style="background:var(--surface2);color:var(--muted);font-size:13px;padding:5px 10px;border-radius:8px;">'+n+'번</span>'; }).join('')
              +'</div>';
          }
          detailHtml+='</div>';
        }
        var toggleBtn=(wrongArr.length||pendArr.length)
          ? '<button class="icon-btn" style="margin-top:9px;padding:5px 12px;font-size:12px;" onclick="toggleWrongDetail(\''+h.id+'\',this)">틀린 번호 보기</button>'
          : '<div style="font-size:12px;color:var(--teal);margin-top:7px;">전부 맞았어요 🎉</div>';
        html += '<div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;">'
          +'<div style="font-size:13.5px;font-weight:700;">📊 '+esc(title)+'</div>'
          +'<div style="font-size:12px;color:var(--teal);margin-top:5px;">제출 완료 · 맞음 '+(c.correct!=null?c.correct:'-')+' / 틀림 '+(c.wrong!=null?c.wrong:'-')+(c.pending?' / △'+c.pending:'')+'</div>'
          +'<div style="font-size:11px;color:var(--muted);margin-top:3px;">'+(sub.submittedAt||'')+' 제출 · 수정은 선생님께</div>'
          +toggleBtn
          +detailHtml
          +'</div>';
      } else {
        html += '<div style="background:var(--surface);border:1.5px solid '+(overdue?'var(--red)':'var(--gold)')+';border-radius:14px;padding:14px;margin-bottom:10px;">'
          +'<div style="font-size:13.5px;font-weight:700;">📝 '+esc(title)+'</div>'
          +(h.due?'<div style="font-size:12px;color:'+(overdue?'var(--red)':'var(--muted)')+';margin-top:3px;font-weight:600;">'+h.due+'까지</div>':'')
          +'<button class="send-btn" style="margin-top:10px;width:100%;" onclick="openAioSolve(\''+h.id+'\')">답 입력하고 채점받기</button>'
          +'</div>';
      }
      return; // 기존 완료체크 카드 렌더 건너뜀
    }

    if(done){
      var doneLabel, btn;
      if(byStudent){
        var at = (HW_DONE[h.id] && HW_DONE[h.id][MY_KEY] && HW_DONE[h.id][MY_KEY].at || '').replace('T',' ').slice(0,16);
        doneLabel = '완료함'+(at?' · '+at:'');
        btn = '<button class="icon-btn" style="margin-top:8px;padding:5px 12px;font-size:12px;" onclick="toggleHwDone(\''+h.id+'\',false)">완료 취소</button>';
      } else {
        // 선생님이 제출 확인한 경우 (학생이 취소할 수 없음)
        doneLabel = '선생님 확인 완료';
        btn = '';
      }
      html += '<div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;opacity:.6;">'
        +'<div style="display:flex;align-items:flex-start;gap:10px;">'
        +'<div style="width:22px;height:22px;border-radius:6px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;">✓</div>'
        +'<div style="flex:1;min-width:0;">'
        +'<div style="font-size:13.5px;font-weight:700;text-decoration:line-through;">'+esc(info||h.name||'숙제')+'</div>'
        +(range?'<div style="font-size:12px;color:var(--muted);margin-top:3px;">'+esc(range)+(h.due?' · '+h.due+'까지':'')+'</div>':'')
        +'<div style="font-size:11px;color:var(--teal);margin-top:4px;">'+doneLabel+'</div>'
        +btn
        +'</div></div></div>';
    } else {
      html += '<div style="background:var(--surface);border:1.5px solid '+(overdue?'var(--red)':'var(--gold)')+';border-radius:14px;padding:14px;margin-bottom:10px;">'
        +'<div style="display:flex;align-items:flex-start;gap:10px;">'
        +'<div style="width:22px;height:22px;border-radius:6px;border:2px solid '+(overdue?'var(--red)':'var(--gold)')+';flex-shrink:0;margin-top:1px;"></div>'
        +'<div style="flex:1;min-width:0;">'
        +'<div style="font-size:13.5px;font-weight:700;">'+esc(info||h.name||'숙제')+'</div>'
        +(range?'<div style="font-size:12px;color:var(--muted);margin-top:3px;">'+esc(range)+(h.due?' · <span style="color:'+(overdue?'var(--red)':'var(--muted)')+';font-weight:600;">'+h.due+'까지</span>':'')+'</div>':'')
        +'<button class="send-btn" style="margin-top:10px;width:100%;" onclick="toggleHwDone(\''+h.id+'\',true)">완료했어요 체크</button>'
        +'</div></div></div>';
    }
  });
  main.innerHTML += html;
}

// 틀린 번호 펼침/접힘
function toggleWrongDetail(hwId, btn){
  var el=document.getElementById('wd-'+hwId);
  if(!el) return;
  var open = el.style.display!=='none';
  el.style.display = open ? 'none' : 'block';
  if(btn) btn.textContent = open ? '틀린 번호 보기' : '접기';
}

// ===== 올인원 자동채점 풀이 화면 (앱 내) =====
var _aioCtx=null;  // { hw, sid, inputs }
function openAioSolve(hwId){
  var sid=mySid();
  var hw=HW_LIST.find(function(x){ return x.id===hwId; });
  if(!hw || !_isAioHw(hw) || !sid){ toast('숙제 정보를 찾을 수 없어요'); return; }
  var prev=WRONG_SUBS[hwId];
  if(prev && prev.submittedFull){ toast('이미 제출한 숙제예요'); return; }
  var main=document.getElementById('main');
  main.innerHTML='<div class="empty">정답표를 불러오는 중…</div>';
  var tmKey=_aioTmKeyOf(hw);
  var p = _aioAKCache[tmKey] ? Promise.resolve(_aioAKCache[tmKey]) : Grader.loadAnswerKey(tmKey).then(function(ak){ _aioAKCache[tmKey]=ak; return ak; });
  p.then(function(ak){
    _aioAK=ak;
    _aioCtx={ hw:hw, sid:sid, inputs:(prev&&prev.inputs)||{} };
    renderAioSolve();
  }).catch(function(){ main.innerHTML='<div class="empty">정답표를 불러오지 못했어요.<br>잠시 후 다시 시도해 주세요.</div>'; });
}

  var main=document.getElementById('main');
  var html='<div style="margin-bottom:12px;">'
    +'<button class="icon-btn" style="padding:6px 12px;font-size:13px;" onclick="setTab(\'hw\')">← 숙제 목록</button></div>'
    +'<div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;">'
    +'<div style="font-size:12px;font-weight:700;color:var(--teal);">📝 '+esc(_aioBookOf(hw))+'</div>'
    +'<div style="font-size:16px;font-weight:800;margin-top:3px;">'+esc(uname)+'</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-top:3px;">'+hw.qStart+'번 ~ '+hw.qEnd+'번</div></div>'
    +'<div style="background:var(--gold-soft);border-radius:10px;padding:10px 13px;font-size:12px;color:#7a5a16;margin-bottom:12px;font-weight:600;line-height:1.6;">'
    +'객관식은 번호를, 단답·분수는 답을 입력하세요. 채점 결과는 제출 후에 보여요.<br>△ 표시 문제는 자동채점이 안 돼서 수업시간에 선생님과 확인합니다.</div>'

    +'<div id="aio-prog" style="text-align:center;font-size:12px;color:var(--muted);margin-top:6px;"></div>';
  main.appendChild(bar);

function buildAioQ(n, ak, unitKey){
  var meta=Grader.getAnswer(ak, unitKey, n);
  var k=meta?meta.k:'self';
  var saved=_aioCtx.inputs[n]||{};
  var TAG={ mc:'객관식', int:'단답', frac:'분수', self:'직접확인' };
  var div=document.createElement('div');
  div.style.cssText='background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px;';
  var head='<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;"><b style="font-size:15px;">'+n+'번</b>'
    +'<span style="font-size:10px;font-weight:700;background:var(--cream2);color:var(--muted);padding:2px 7px;border-radius:7px;">'+(TAG[k]||'')+'</span></div>';
  var body='';
  if(k==='mc'){
    var sym=['','①','②','③','④','⑤'];
    body='<div style="display:flex;gap:7px;">';
    for(var i=1;i<=5;i++){
      var on=(String(saved.raw)===String(i));
      body+='<button onclick="pickAioMc('+n+','+i+')" style="flex:1;height:44px;border-radius:8px;border:1.5px solid '+(on?'var(--teal)':'var(--bd2)')+';background:'+(on?'var(--teal)':'var(--surface2)')+';color:'+(on?'#fff':'var(--ink)')+';font-size:17px;font-weight:700;cursor:pointer;">'+sym[i]+'</button>';
    }
    body+='</div>';
  } else if(k==='int'){
    var neg=(saved.raw&&String(saved.raw).charAt(0)==='-');
    var absv=saved.raw?String(saved.raw).replace('-',''):'';
    body='<div style="display:flex;gap:8px;align-items:center;">'
      +'<button id="aio-sign-'+n+'" data-neg="'+(neg?'1':'0')+'" onclick="toggleAioSign('+n+')" style="width:46px;height:44px;border-radius:8px;border:1.5px solid '+(neg?'var(--ink)':'var(--bd2)')+';background:'+(neg?'var(--ink)':'var(--surface2)')+';color:'+(neg?'var(--bg)':'var(--ink)')+';font-size:19px;font-weight:700;cursor:pointer;">±</button>'
      +'<input id="aio-in-'+n+'" inputmode="numeric" placeholder="정답" value="'+esc(absv)+'" oninput="onAioInt('+n+')" style="flex:1;height:44px;border-radius:8px;border:1.5px solid var(--bd2);background:var(--bg2);color:var(--ink);padding:0 14px;font-size:16px;font-family:var(--sans);"></div>';
  } else if(k==='frac'){
    var sv=saved.raw||'', num='', den='';
    if(sv.indexOf('/')>-1){ var pp=sv.split('/'); num=pp[0]; den=pp[1]; } else { num=sv; }
    body='<div style="display:flex;gap:12px;align-items:center;"><div style="width:90px;">'
      +'<input id="aio-fn-'+n+'" inputmode="numeric" placeholder="분자" value="'+esc(num)+'" oninput="onAioFrac('+n+')" style="width:90px;height:38px;border-radius:8px;border:1.5px solid var(--bd2);background:var(--bg2);color:var(--ink);text-align:center;font-size:16px;font-family:var(--sans);">'
      +'<div style="height:2px;background:var(--ink);margin:5px 0;"></div>'
      +'<input id="aio-fd-'+n+'" inputmode="numeric" placeholder="분모" value="'+esc(den)+'" oninput="onAioFrac('+n+')" style="width:90px;height:38px;border-radius:8px;border:1.5px solid var(--bd2);background:var(--bg2);color:var(--ink);text-align:center;font-size:16px;font-family:var(--sans);"></div>'
      +'<div style="font-size:12px;color:var(--muted);">정수면 분자만,<br>분수면 둘 다</div></div>';
  } else {
    body='<div style="font-size:12px;color:#7a5a16;background:var(--gold-soft);border-radius:8px;padding:9px 12px;font-weight:600;">△ 자동채점이 안 되는 문제예요. 답을 적지 않아도 되고, 수업시간에 선생님과 확인합니다.</div>';
  }
  div.innerHTML=head+body;
  return div;
}

function pickAioMc(n,i){
  _aioCtx.inputs[n]=Object.assign({},_aioCtx.inputs[n],{raw:String(i)});
  renderAioSolve();
}
function toggleAioSign(n){
  var b=document.getElementById('aio-sign-'+n);
  var neg = b.getAttribute('data-neg')==='1' ? false : true;
  b.setAttribute('data-neg', neg?'1':'0');
  b.style.background = neg?'var(--ink)':'var(--surface2)';
  b.style.color = neg?'var(--bg)':'var(--ink)';
  b.style.borderColor = neg?'var(--ink)':'var(--bd2)';
  onAioInt(n);
}
function onAioInt(n){
  var b=document.getElementById('aio-sign-'+n);
  var neg = b.getAttribute('data-neg')==='1';
  var v=(document.getElementById('aio-in-'+n).value||'').replace(/[^0-9]/g,'');
  _aioCtx.inputs[n]=Object.assign({},_aioCtx.inputs[n],{raw:(v===''?'':(neg?'-':'')+v)});
  updateAioProg();
}
function onAioFrac(n){
  var num=(document.getElementById('aio-fn-'+n).value||'').trim();
  var den=(document.getElementById('aio-fd-'+n).value||'').trim();
  _aioCtx.inputs[n]=Object.assign({},_aioCtx.inputs[n],{raw:(den===''?num:num+'/'+den)});
  updateAioProg();
}
function updateAioProg(){
  var ctx=_aioCtx; if(!ctx) return;
  var hw=ctx.hw, answered=0, gradable=0, selfCnt=0;
  for(var n=hw.qStart;n<=hw.qEnd;n++){
    var meta=Grader.getAnswer(_aioAK, hw.unitKey, n);
    if(meta && meta.k==='self'){ selfCnt++; continue; }
    gradable++;
    var raw=(ctx.inputs[n]||{}).raw;
    if(raw!=null && String(raw).trim()!=='') answered++;
  }
  var el=document.getElementById('aio-prog');
  if(el) el.innerHTML='입력 '+answered+' / '+gradable+'문제'+(selfCnt?' (직접확인 '+selfCnt+')':'');
}

// 학생 체크 → 대시보드 숙제(bjm_homework) status 반영
// bjm_homework는 배열/객체 형태를 보존하면서 충돌 시 다시 계산되도록 transaction 사용
function syncHwStatusToDashboard(hwId, status){
  try{
    db.ref('bjm_homework').transaction(function(v){
      if(!v) return v;
      if(Array.isArray(v)){
        for(var i=0;i<v.length;i++){
          if(v[i] && String(v[i].id)===String(hwId)){
            v[i].status=status;
            break;
          }
        }
      } else {
        Object.keys(v).some(function(k){
          if(v[k] && String(v[k].id)===String(hwId)){
            v[k].status=status;
            return true;
          }
          return false;
        });
      }
      return v;
    });
  }catch(e){}
}

function fmtDate(d){
  var y=d.getFullYear();
  var m=('0'+(d.getMonth()+1)).slice(-2);
  var dd=('0'+d.getDate()).slice(-2);
  return y+'-'+m+'-'+dd;
}
function todayStr(){ return fmtDate(new Date()); }

// 플래너 전용 '오늘' — 새벽 4시 이전은 전날로 간주
// (학생들이 새벽에 그날 공부를 정리해 올리는 경우가 많아서)
function plannerToday(){
  var d = new Date();
  if(d.getHours() < 4){ d.setDate(d.getDate() - 1); }
  return fmtDate(d);
}

function loadPlanners(cb){
  db.ref(CP('class_planner')).once('value').then(function(snap){
    PLANNERS = snap.val()||{};
    db.ref(CP('class_cheer')).once('value').then(function(s2){
      CHEERS = s2.val()||{};
      // 반응 데이터도 함께 로드
      db.ref(CP('class_reactions')).once('value').then(function(s3){
        REACTIONS = s3.val()||{};
        if(cb) cb();
      }).catch(function(){ if(cb) cb(); });
    }).catch(function(){ if(cb) cb(); });
  }).catch(function(){ if(cb) cb(); });
}

// 작성 대상 날짜 (null이면 오늘). '내일' 미리적기용
var _plannerTargetDate = null;
function plannerTomorrow(){
  var d=new Date();
  if(d.getHours()<4){ /* 새벽이면 '오늘'이 전날이므로 내일=실제 오늘 */ }
  else { d.setDate(d.getDate()+1); }
  // plannerToday 기준 +1일
  var base = new Date(plannerToday()+'T12:00:00');
  base.setDate(base.getDate()+1);
  return fmtDate(base);
}
function setPlannerTarget(which){
  _plannerTargetDate = (which==='tomorrow') ? plannerTomorrow() : null;
  _plannerEditMode = false;
  // 대상 날짜에 이미 작성한 게 있으면 불러와 편집, 없으면 새로
  var tgt = _plannerTargetDate || plannerToday();
  var existing = (PLANNERS[MY_KEY]||{})[tgt];
  if(existing){
    _plannerItems = (existing.items||[]).slice();
    plannerImgs = (existing.imgs||[]).slice();
    _plannerEditMode = true;
  } else {
    _plannerItems = []; plannerImgs = [];
  }
  _plannerPlace='학원';
  renderMain();
  setTimeout(function(){ renderPlannerItems(); renderPlannerPreview(); },30);
}

// 내 카드: 받은 응원 요약만
function renderCheerSummary(date, myKey){
  var cheers = (CHEERS[date] && CHEERS[date][myKey]) || {};
  var senders = Object.keys(cheers);
  if(!senders.length) return '<div style="font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px;margin-top:9px;">아직 받은 응원이 없어요</div>';

  senders.forEach(function(s){ var k=cheers[s]; if(counts[k]!=null) counts[k]++; });
  var h='<div style="display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:9px;margin-top:9px;font-size:12px;color:var(--muted);">받은 응원';
  CHEER_LIST.forEach(function(p){
    if(counts[p[0]]) h+='<span style="display:inline-flex;align-items:center;gap:2px;"><img src="'+CHEER_IMGS[p[0]]+'" style="width:20px;height:20px;border-radius:4px;"><b style="color:var(--teal);">'+counts[p[0]]+'</b></span>';
  });

// 응원 보내기/취소 (같은 학생에 한 종류, 다시 누르면 취소)
function sendCheer(date, targetKey, cheerKey){
  if(!requireStudentSession()) return;
  if(targetKey===MY_KEY) return;
  var path = CP('class_cheer/')+date+'/'+targetKey+'/'+MY_KEY;
  var cur = (CHEERS[date] && CHEERS[date][targetKey] && CHEERS[date][targetKey][MY_KEY]) || null;
  if(!CHEERS[date]) CHEERS[date]={};
  if(!CHEERS[date][targetKey]) CHEERS[date][targetKey]={};
  if(cur===cheerKey){
    db.ref(path).remove();
    delete CHEERS[date][targetKey][MY_KEY];
  } else {
    db.ref(path).set(cheerKey);
    CHEERS[date][targetKey][MY_KEY]=cheerKey;
  }
  renderMain();
}

// 길게 누르기(모바일) / 버튼(PC) → 이모티콘 선택 바 띄우기
var _reactPickerEl = null;
function openReactionPicker(reactionId, anchorEl){
  closeReactionPicker();
  var mine = (REACTIONS[reactionId]||{})[MY_KEY] || null;
  var bar = document.createElement('div');
  bar.className = 'react-picker';
  bar.style.cssText = 'position:fixed;z-index:600;display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:36px;padding:12px 16px;box-shadow:0 6px 20px rgba(0,0,0,.18);';
  CHEER_LIST.forEach(function(p){
    var key=p[0];
    var on = (mine===key);
    var b = document.createElement('button');
    b.style.cssText = 'width:64px;height:64px;border-radius:50%;border:'+(on?'2px solid var(--teal)':'none')+';background:'+(on?'var(--teal-bg)':'transparent')+';padding:0;cursor:pointer;';
    b.innerHTML = '<img src="'+CHEER_IMGS[key]+'" style="width:52px;height:52px;border-radius:8px;object-fit:cover;">';
    b.onclick = function(ev){ ev.stopPropagation(); toggleReaction(reactionId, key); closeReactionPicker(); };
    bar.appendChild(b);
  });
  document.body.appendChild(bar);
  _reactPickerEl = bar;
  // 위치: 앵커 위쪽 중앙
  var r = anchorEl.getBoundingClientRect();
  var bw = bar.offsetWidth, bh = bar.offsetHeight;
  var left = Math.min(Math.max(8, r.left + r.width/2 - bw/2), window.innerWidth - bw - 8);
  var top = r.top - bh - 8;
  if(top < 8) top = r.bottom + 8;  // 위 공간 없으면 아래로
  bar.style.left = left+'px';
  bar.style.top = top+'px';
  setTimeout(function(){ document.addEventListener('click', closeReactionPicker, {once:true}); }, 10);
}
function closeReactionPicker(){
  if(_reactPickerEl){ try{ _reactPickerEl.remove(); }catch(e){} _reactPickerEl=null; }
}

function toggleReaction(reactionId, emojiKey){
  if(!isAdmin && !requireStudentSession()) return;
  var path = CP('class_reactions/')+reactionId+'/'+MY_KEY;
  var cur = (REACTIONS[reactionId]||{})[MY_KEY] || null;
  if(!REACTIONS[reactionId]) REACTIONS[reactionId]={};
  if(cur===emojiKey){
    db.ref(path).remove();
    delete REACTIONS[reactionId][MY_KEY];
  } else {
    db.ref(path).set(emojiKey);
    REACTIONS[reactionId][MY_KEY]=emojiKey;
  }
  renderMain();
}

// 대상 요소에 길게누르기/우클릭/버튼 동작 연결 (HTML에 onmousedown 등으로 호출)

function addPlannerItem(){
  var subj=(document.getElementById('pl-subject').value||'').trim();
  var amt=(document.getElementById('pl-amount').value||'').trim();
  if(!subj && !amt){ toast('과목이나 분량을 적어주세요'); return; }
  _plannerItems.push({ place:_plannerPlace, subject:subj, amount:amt, done:false });
  document.getElementById('pl-subject').value='';
  document.getElementById('pl-amount').value='';
  renderPlannerItems();
  // 추가 후 입력칸에 머물러 계속 적을 수 있게 (화면이 위로 튀지 않도록)

}
function removePlannerItem(i){ _plannerItems.splice(i,1); renderPlannerItems(); }
// 자습 항목 체크 토글 (작성 폼 안에서)
function togglePlannerItemDone(i){
  if(_plannerItems[i]) _plannerItems[i].done = !_plannerItems[i].done;
  renderPlannerItems();
  updateSelfAchieveHint();
}
// 자습 항목들의 체크 비율 → 달성도 자동
function selfAchievePct(items){
  var self = (items||[]).filter(function(it){ return it.place==='자습'; });
  if(!self.length) return null;
  var done = self.filter(function(it){ return it.done; }).length;
  return Math.round(done/self.length*100);
}
function updateSelfAchieveHint(){
  var box=document.getElementById('pl-self-achieve'); if(!box) return;
  var pct=selfAchievePct(_plannerItems);
  if(pct===null){ box.style.display='none'; return; }
  box.style.display='block';
  var self=_plannerItems.filter(function(it){return it.place==='자습';});
  var done=self.filter(function(it){return it.done;}).length;
  box.innerHTML='자습 달성도 <b style="color:var(--teal);">'+pct+'%</b> <span style="color:var(--muted);font-size:11px;">('+done+'/'+self.length+' 완료)</span>';
}
function renderPlannerItems(){
  var box=document.getElementById('pl-items'); if(!box) return;
  if(!_plannerItems.length){ box.innerHTML=''; updateSelfAchieveHint(); return; }
  box.innerHTML = _plannerItems.map(function(it,i){
    var tagBg = it.place==='학원' ? 'var(--teal)' : 'var(--gold)';
    // 자습 항목엔 체크박스, 학원은 없음
    var chk = '';
    if(it.place==='자습'){
      chk = '<button onclick="togglePlannerItemDone('+i+')" style="flex-shrink:0;width:22px;height:22px;border-radius:6px;border:1.5px solid '+(it.done?'var(--teal)':'var(--line)')+';background:'+(it.done?'var(--teal)':'var(--surface2)')+';color:'+(it.done?'#fff':'var(--muted2)')+';cursor:pointer;font-size:13px;line-height:1;">'+(it.done?'✓':'')+'</button>';
    }
    var txtStyle = (it.place==='자습'&&it.done)?'text-decoration:line-through;color:var(--muted);':'';
    return '<div style="display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;">'
      +chk
      +'<span style="flex-shrink:0;font-size:11px;font-weight:700;color:#fff;background:'+tagBg+';padding:2px 8px;border-radius:20px;">'+it.place+'</span>'
      +'<span style="flex:1;font-size:13px;min-width:0;'+txtStyle+'">'+(it.subject?'<b>'+esc(it.subject)+'</b> ':'')+esc(it.amount||'')+'</span>'
      +'<button onclick="removePlannerItem('+i+')" style="flex-shrink:0;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;">×</button>'
      +'</div>';
  }).join('');
  updateSelfAchieveHint();
}

function plannerBody(p){

    p.items.forEach(function(it){

function onPickPlannerImg(ev){
  var files=ev.target.files; if(!files||!files.length) return;

function submitPlanner(){
  if(!requireStudentSession()) return;
  // 입력칸에 남아있는 항목도 자동 포함
  var subj=(document.getElementById('pl-subject').value||'').trim();
  var amt=(document.getElementById('pl-amount').value||'').trim();
  if(subj || amt){ _plannerItems.push({ place:_plannerPlace, subject:subj, amount:amt, done:false }); }

  var note=(document.getElementById('pl-note').value||'').trim();
  if(!_plannerItems.length && !note && plannerImgs.length===0){ toast('내용을 입력해 주세요'); return; }
  var target = _plannerTargetDate || plannerToday();
  // 자습 체크 비율로 달성도 자동
  var pct = selfAchievePct(_plannerItems);
  var achieve = (pct===null) ? '' : (pct+'%');
  var p={ items:_plannerItems.slice(), achieve:achieve, selfPct:pct, note:note, name:MY_NAME, at:new Date().toISOString() };
  if(plannerImgs.length) p.imgs=plannerImgs.slice();
  db.ref(CP('class_planner/')+MY_KEY+'/'+target).set(p).then(function(){
    if(!PLANNERS[MY_KEY]) PLANNERS[MY_KEY]={};
    PLANNERS[MY_KEY][target]=p;
    plannerImgs=[]; _plannerItems=[]; _plannerPlace='학원';
    _plannerEditMode=false; _plannerTargetDate=null;
    notifyTelegram('📅 플래너 제출\n'+MY_NAME+' 학생 ('+target+')');
    toast('플래너를 저장했어요');
    renderMain();
  }).catch(function(){ toast('제출 실패. 다시 시도해 주세요'); });
}

  plannerImgs=(e.imgs||[]).slice();

}

// 관리자: 날짜별 제출 현황
var _plannerDate = null;
function renderPlannerAdmin(){
  var date = _plannerDate || plannerToday();
  // 현재 반 멤버 명단
  var members = (CLASSES[CURRENT_CLASS] && CLASSES[CURRENT_CLASS].members) ? CLASSES[CURRENT_CLASS].members : {};

  // 미제출

// 링크 주소 보정: https:// 빠뜨리고 붙여넣어도 자동으로 붙여줌
function normLinkUrl(u){
  u=(u||'').trim();
  if(!u) return '';
  if(/^https?:\/\//i.test(u)) return u;
  if(u.indexOf('.')>-1 && !/\s/.test(u)) return 'https://'+u;
  return '';
}
function attachLink(){
  var name=(document.getElementById('lk-name').value||'').trim();

  if(!url){ toast('올바른 링크 주소를 넣어 주세요 (드라이브 공유 링크 등)'); return; }
  if(!name){ name='첨부파일'; }
  uploadFile={ name:name, url:url };
  closeModal();
  renderPreview();
  toast('링크를 첨부했어요');
}

function onAnsImgs(ev){
  var files=ev.target.files; if(!files||!files.length) return;
  var remain=files.length;
  Array.prototype.forEach.call(files,function(f){
    compressImage(f,function(b64){ _answerImgs.push(b64); remain--; if(remain===0) renderAnsPreview(); });
  });
}
// 붙여넣기(Ctrl+V)로 캡처 이미지 첨부
function onAnsPaste(ev){
  var items=(ev.clipboardData||window.clipboardData||{}).items;
  if(!items) return;
  var found=false;
  for(var i=0;i<items.length;i++){
    if(items[i].type && items[i].type.indexOf('image')===0){
      var f=items[i].getAsFile();
      if(f){ found=true; compressImage(f,function(b64){ _answerImgs.push(b64); renderAnsPreview(); }); }
    }
  }
  if(found) ev.preventDefault();  // 이미지면 텍스트 칸에 깨진 문자 안 들어가게
}
// '캡처 붙여넣기' 버튼 — 클립보드 API로 이미지 읽기 (지원 브라우저)
function pasteAnsFromClipboard(){
  if(navigator.clipboard && navigator.clipboard.read){
    navigator.clipboard.read().then(function(items){
      var any=false;
      var done=0, total=items.length;
      if(!total){ toast('클립보드에 캡처가 없어요. 화면을 캡처한 뒤 눌러주세요.'); return; }
      items.forEach(function(it){
        var imgType=(it.types||[]).find(function(t){ return t.indexOf('image')===0; });
        if(imgType){ any=true;
          it.getType(imgType).then(function(blob){ compressImage(blob,function(b64){ _answerImgs.push(b64); renderAnsPreview(); }); });
        }
      });
      if(!any) toast('클립보드에 캡처(이미지)가 없어요.');
    }).catch(function(){
      toast('붙여넣기 권한이 필요해요. 답변칸을 클릭한 뒤 Ctrl+V로 붙여넣어 주세요.');
    });
  } else {
    toast('이 브라우저는 버튼 붙여넣기를 지원하지 않아요. 답변칸에서 Ctrl+V로 붙여넣어 주세요.');
  }
}
function renderAnsPreview(){
  var pv=document.getElementById('ans-preview'); if(!pv) return;
  var h='';
  _answerImgs.forEach(function(src,i){ h+='<div class="pv"><img src="'+src+'"><button class="del" onclick="rmAnsImg('+i+')">×</button></div>'; });

}

  html+='<div class="adm-section"><h3>가입 신청 <span style="font-size:12px;color:var(--muted);font-weight:500;">반 배정 대기</span></h3>';

          if(inThis){

      }

}

// ===== 시험 D-day =====
var MY_EXAM = null;       // 'YYYY-MM-DD' 또는 null
var MY_EXAM_NAME = '';    // 시험 이름
function loadExamDate(cb){
  if(isAdmin){ if(cb) cb(); return; }  // 관리자는 D-day 없음
  db.ref(CP('class_users/')+MY_KEY).once('value').then(function(snap){
    var u=snap.val()||{};

    MY_EXAM_NAME = u.examName || '';
    renderDdayBar();
    if(cb) cb();
  }).catch(function(){ if(cb) cb(); });
}
function dDayNum(dateStr){
  // 오늘과 시험일의 날짜 차이 (양수=남음, 0=당일, 음수=지남)
  var t=todayStr().split('-'), e=dateStr.split('-');
  var td=new Date(parseInt(t[0],10),parseInt(t[1],10)-1,parseInt(t[2],10));
  var ed=new Date(parseInt(e[0],10),parseInt(e[1],10)-1,parseInt(e[2],10));
  return Math.round((ed-td)/86400000);
}
function renderDdayBar(){
  var bar=document.getElementById('ddaybar');
  if(!bar) return;
  if(isAdmin){ bar.style.display='none'; return; }
  bar.style.display='block';
  if(!MY_EXAM){
    bar.innerHTML='<div style="background:var(--gold-soft);color:var(--gold);padding:9px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);">'

      +'<button onclick="openExamSetup()" style="background:var(--gold);color:#fff;border:none;border-radius:20px;padding:5px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);">설정</button></div>';
    return;
  }
  var n=dDayNum(MY_EXAM);
  var examLabel = MY_EXAM_NAME ? esc(MY_EXAM_NAME) : '시험';
  var label, color='var(--teal)';
  if(n>0){ label=examLabel+'까지 D-'+n; }
  else if(n===0){ label='오늘이 '+examLabel+'! D-DAY'; color='var(--red)'; }
  else { label=examLabel+'이(가) 지났어요 (D+'+(-n)+')'; color='var(--muted)'; }
  bar.innerHTML='<div style="background:'+color+';color:#fff;padding:10px 16px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:space-between;">'
    +'<span>🎯 '+label+' <span style="font-weight:500;font-size:12px;opacity:.85;">('+MY_EXAM+')</span></span>'
    +'<button onclick="openExamSetup()" style="background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);">변경</button></div>';
}
function openExamSetup(){
  var h='<h3>시험 D-day 설정</h3>';
  h+='<div style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:12px;">시험 이름과 첫날을 입력하면 모든 화면 위에 D-day가 표시돼요.</div>';
  h+='<label style="font-size:12px;font-weight:700;">시험 이름</label>';
  h+='<input type="text" id="exam-name" class="fld" placeholder="예: 1학기 기말고사" value="'+esc(MY_EXAM_NAME||'')+'" style="margin-top:4px;">';
  h+='<label style="font-size:12px;font-weight:700;">시험 첫날</label>';
  h+='<input type="date" id="exam-date" class="fld" value="'+(MY_EXAM||'')+'" style="margin-top:4px;">';
  h+='<div style="display:flex;gap:8px;margin-top:6px;">';
  if(MY_EXAM){ h+='<button class="icon-btn" style="flex:1;color:var(--red);" onclick="clearExamDate()">삭제</button>'; }
  h+='<button class="icon-btn" style="flex:1;" onclick="closeModal()">취소</button>';
  h+='<button class="send-btn" style="flex:1;margin:0;" onclick="saveExamDate()">저장</button>';
  h+='</div>';
  openModal(h);
}
function saveExamDate(){
  if(isAdmin || !requireStudentSession()) return;
  var d=document.getElementById('exam-date').value;
  var nm=(document.getElementById('exam-name').value||'').trim();
  if(!d){ toast('시험 첫날을 선택해 주세요'); return; }
  db.ref(CP('class_users/')+MY_KEY).update({ examDate:d, examName:nm }).then(function(){
    MY_EXAM=d; MY_EXAM_NAME=nm; closeModal(); renderDdayBar(); toast('시험일을 저장했어요');
  }).catch(function(){ toast('저장 실패. 다시 시도해 주세요'); });
}
function clearExamDate(){
  if(isAdmin || !requireStudentSession()) return;
  db.ref(CP('class_users/')+MY_KEY).update({ examDate:null, examName:null }).then(function(){
    MY_EXAM=null; MY_EXAM_NAME=''; closeModal(); renderDdayBar(); toast('시험일을 삭제했어요');
  });
}

// ===== 시작 =====
// 익명 로그인이 끝난 뒤 데이터를 읽어야 보안 규칙에 막히지 않는다.
(window._authReady || Promise.resolve()).then(function(){
verifyAdminSession(function(){
verifyStudentSession(function(){
  loadAll(function(){
    var list=myClasses();
    // 학생은 첫 반 자동 진입, 관리자는 반 선택 화면을 먼저 보도록 자동선택 안 함

    if(CURRENT_CLASS){
      loadPosts();
      if(!isAdmin){ loadHomework(renderMain); }  // 홈 통계용 숙제 데이터 미리 로드
    } else { renderMain(); }
    startClassesLive();
    loadExamDate();
  });
});
});
});

<script>
/* ===== 웹 푸시 알림 (1단계: 구독 등록) =====
 * 동작: 사용자가 '알림 켜기'를 누르면 권한 요청 → 구독 생성 →
 *       구독 정보를 Firebase의 push_subscriptions/{MY_KEY} 에 저장.
 * 실제 발송(2·3단계)은 별도 서버/Actions에서 이 구독 정보로 보낸다.
 */

// VAPID 공개키 — 2단계에서 생성해 여기에 넣는다 (현재는 비어 있음)
var VAPID_PUBLIC_KEY = "BPE7ba752gziPWYhyiSNQeXLKdzI1aPdO4e28bcdTliKXzu5ZD6MfBmz9t_6j5texTdb5_9xjEFHOM3ZyLpBa6A";

// base64 → Uint8Array (푸시 구독에 필요한 형식 변환)
function _urlBase64ToUint8Array(base64String){
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  var raw = atob(base64);
  var arr = new Uint8Array(raw.length);
  for (var i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

// 푸시 지원 환경인지
function _pushSupported(){
  return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
}

// iOS인지 + 홈화면 설치(standalone) 상태인지 (iOS는 설치해야 알림 가능)
function _isIos(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function _isStandalone(){ return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches; }

var _swReg = null;

// 서비스 워커 등록 (앱 로드 시 1회)
function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return Promise.reject('서비스워커 미지원');
  return navigator.serviceWorker.register('./sw.js').then(function(reg){ _swReg = reg; return reg; });
}

// 현재 알림 상태에 따라 버튼 표시 갱신
function updateNotifyButton(){
  var btn = document.getElementById('notify-btn');
  if(!btn) return;
  if(!_pushSupported()){ btn.style.display='none'; return; }
  // 여기까지 왔으면 버튼을 보이게 함
  btn.style.display='inline-block';
  // iOS인데 홈화면 설치 안 됐으면 안내만
  if(_isIos() && !_isStandalone()){
    btn.textContent = '🔔 알림 받기(홈화면 추가 필요)';
    btn.onclick = function(){ alert('아이폰은 먼저 이 앱을 홈 화면에 추가해야 알림을 받을 수 있어요.\n\n사파리 하단 공유 버튼 → "홈 화면에 추가" 후, 홈 화면의 앱 아이콘으로 다시 열어주세요.'); };
    return;
  }
  var perm = Notification.permission;
  if(perm === 'granted'){
    btn.textContent = '🔔 알림 켜짐';
    btn.style.opacity = '0.6';
    btn.onclick = function(){
      if(confirm('알림을 다시 설정할까요? (문제가 있을 때 눌러주세요)')){ enablePush(); }
    };
    // 자동으로 구독 최신화 (공개키 바뀐 경우 새 키로 갱신)
    ensureFreshSubscription();
  } else if(perm === 'denied'){
    btn.textContent = '🔔 알림 차단됨';
    btn.style.opacity = '1';
    btn.onclick = function(){ alert('알림이 차단되어 있어요. 브라우저/폰 설정에서 이 사이트의 알림을 허용해주세요.'); };
  } else {
    btn.textContent = '🔔 알림 켜기';
    btn.style.opacity = '1';
    btn.onclick = enablePush;
  }
}

// 권한은 있으나 구독이 옛 공개키일 수 있음 → 현재 공개키와 비교해 자동 재구독
function ensureFreshSubscription(){
  if(Notification.permission !== 'granted') return;
  if(typeof MY_KEY === 'undefined' || !MY_KEY) return;
  var regP = _swReg ? Promise.resolve(_swReg) : registerServiceWorker();
  regP.then(function(reg){
    return reg.pushManager.getSubscription().then(function(existing){
      var targetKey = _urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
      function doSubscribe(){
        return reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: targetKey })
          .then(function(sub){
            var subData = JSON.parse(JSON.stringify(sub));
            return db.ref(CP('push_subscriptions/')+MY_KEY).set({
              endpoint: subData.endpoint, keys: subData.keys,
              name: (typeof MY_NAME!=='undefined'? MY_NAME : ''),
              role: (typeof MY_ROLE!=='undefined'? MY_ROLE : 'student'),
              updatedAt: new Date().toISOString()
            });
          });
      }
      if(!existing){ return doSubscribe(); }
      // 기존 구독의 공개키가 현재 키와 같은지 확인
      var cur = existing.options && existing.options.applicationServerKey;
      var same = false;
      if(cur){
        var a = new Uint8Array(cur), b = targetKey;
        if(a.length === b.length){ same = true; for(var i=0;i<a.length;i++){ if(a[i]!==b[i]){ same=false; break; } } }
      }
      if(same){
        // 키 같으면 저장만 최신화
        var sd = JSON.parse(JSON.stringify(existing));
        return db.ref(CP('push_subscriptions/')+MY_KEY).set({
          endpoint: sd.endpoint, keys: sd.keys,
          name: (typeof MY_NAME!=='undefined'? MY_NAME : ''),
          role: (typeof MY_ROLE!=='undefined'? MY_ROLE : 'student'),
          updatedAt: new Date().toISOString()
        });
      }
      // 키 다르면 해지 후 새로 구독
      return existing.unsubscribe().then(doSubscribe);
    });
  }).catch(function(e){ console.log('구독 최신화 건너뜀:', e); });
}

// 알림 켜기 (권한 요청 + 구독 + 저장)
function enablePush(){
  if(!_pushSupported()){ alert('이 브라우저는 알림을 지원하지 않아요.'); return; }
  if(VAPID_PUBLIC_KEY === "__VAPID_PUBLIC_KEY__"){
    alert('알림 발송 설정이 아직 완료되지 않았어요. (관리자 설정 대기 중)');
    return;
  }
  Notification.requestPermission().then(function(perm){
    if(perm !== 'granted'){ updateNotifyButton(); return; }
    var regP = _swReg ? Promise.resolve(_swReg) : registerServiceWorker();
    regP.then(function(reg){
      // 기존 구독이 있으면 일단 해지하고(옛 공개키일 수 있음) 새 키로 다시 구독
      return reg.pushManager.getSubscription().then(function(existing){
        if(existing){ return existing.unsubscribe().then(function(){ return reg; }); }
        return reg;
      }).then(function(reg2){
        return reg2.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: _urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      });
    }).then(function(sub){
      // 구독 정보를 Firebase에 저장 (MY_KEY 기준)
      if(typeof MY_KEY === 'undefined' || !MY_KEY){ alert('로그인 후 이용해주세요.'); return; }
      var subData = JSON.parse(JSON.stringify(sub));
      var rec = {
        endpoint: subData.endpoint,
        keys: subData.keys,
        name: (typeof MY_NAME!=='undefined'? MY_NAME : ''),
        role: (typeof MY_ROLE!=='undefined'? MY_ROLE : 'student'),
        updatedAt: new Date().toISOString()
      };
      return db.ref(CP('push_subscriptions/')+MY_KEY).set(rec);
    }).then(function(){
      updateNotifyButton();
      alert('알림이 켜졌어요! 이제 새 숙제·공지 등을 알림으로 받을 수 있어요.');
    }).catch(function(err){
      console.error('푸시 구독 실패:', err);
      alert('알림 켜기에 실패했어요. 잠시 후 다시 시도해주세요.');
    });
  });
}

// 앱 로드 시 서비스 워커 등록 + 버튼 상태 갱신
if(_pushSupported()){
  registerServiceWorker().then(function(){ updateNotifyButton(); }).catch(function(){ updateNotifyButton(); });
} else {
  updateNotifyButton();
}
// 로그인/렌더 완료 후에도 한 번 더 갱신 (버튼이 늦게 만들어지는 경우 대비)
setTimeout(updateNotifyButton, 1500);
setTimeout(updateNotifyButton, 3000);
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>김병진수학연구소 클래스</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a0e13">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#0a0e13; --bg2:#0d1117; --surface:#13181f; --surface2:#1a212b;
    --deep:#05221b; --teal:#1f6f5c; --teal-l:#4fb286;
    --gold:#d2a64a; --cream:#13181f; --line:#222b38; --bd2:#2a3340;
    --ink:#f0f3f7; --muted:#8a96a6;
    --sans:'Pretendard','Apple SD Gothic Neo',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .box{width:100%;max-width:380px;}
  .logo{text-align:center;margin-bottom:36px;}
  .logo .mark{display:inline-block;width:13px;height:13px;background:var(--gold);border-radius:50%;margin-right:10px;vertical-align:middle;}
  .logo h1{display:inline;font-size:25px;font-weight:700;color:var(--ink);letter-spacing:-.5px;}
  .logo p{margin-top:12px;font-size:14px;color:var(--muted);font-weight:400;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px 26px;}
  .tabs{display:flex;gap:6px;margin-bottom:26px;background:var(--bg2);padding:5px;border-radius:12px;}
  .tab{flex:1;text-align:center;padding:11px;font-size:14.5px;font-weight:500;color:var(--muted);border-radius:9px;cursor:pointer;transition:.2s;}
  .tab.on{background:var(--surface2);color:var(--teal-l);}
  .fg{margin-bottom:16px;}
  .fg label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin-bottom:7px;}
  .fg input{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--bd2);border-radius:10px;padding:13px 15px;font-size:16px;font-family:var(--sans);transition:.2s;}
  .fg input:focus{outline:none;border-color:var(--teal-l);}
  .gsel{width:100%;border:1px solid var(--bd2);border-radius:10px;padding:13px 15px;font-size:16px;font-family:var(--sans);background:var(--bg2);color:var(--ink);cursor:pointer;}
  .gsel:focus{outline:none;border-color:var(--teal-l);}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;}
  .btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:30px;padding:15px;font-size:16px;font-weight:500;cursor:pointer;transition:.25s;font-family:var(--sans);margin-top:6px;}
  .btn:active{background:var(--deep);}
  .btn:disabled{opacity:.5;}
  .msg{text-align:center;font-size:13.5px;margin-top:16px;min-height:18px;font-weight:500;}
  .msg.err{color:#e07a86;}
  .msg.ok{color:var(--teal-l);}
  .panel{display:none;}
  .panel.on{display:block;}
  .admin-link{text-align:center;margin-top:22px;}
  .admin-link a{font-size:12.5px;color:var(--muted);text-decoration:underline;cursor:pointer;}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div><span class="mark"></span><h1>김병진수학연구소</h1><span style="font-size:14px;font-weight:500;color:var(--muted);margin-left:7px;">클래스</span></div>
    <p>우리 반 학습 공간 · Class</p>
  </div>
  <div class="card">
    <div class="tabs">
      <div class="tab on" id="tab-login" onclick="switchTab('login')">로그인</div>
      <div class="tab" id="tab-signup" onclick="switchTab('signup')">처음이에요</div>
    </div>

    <!-- 로그인 -->
    <div class="panel on" id="panel-login">
      <div class="fg"><label>이름</label><input type="text" id="li-name" placeholder="이름을 입력하세요"></div>
      <div class="fg"><label>학년 <span style="font-weight:400;color:var(--muted);font-size:12px;">(같은 이름 친구가 있을 때만)</span></label><select id="li-grade" class="gsel"><option value="">선택 안 함</option><option>초3</option><option>초4</option><option>초5</option><option>초6</option><option>중1</option><option>중2</option><option>중3</option><option>고1</option><option>고2</option><option>고3</option><option>기타</option></select></div>
      <div class="fg"><label>비밀번호</label><input type="password" id="li-pw" placeholder="비밀번호"></div>
      <button class="btn" id="li-btn" onclick="doLogin()">로그인</button>
      <!-- ★저장소가 비워지는 것은 코드로 못 막는다 (지시 260825-0730 ③). 알려 두기만 한다★ -->
      <div class="hint" style="margin-top:10px;text-align:center;line-height:1.5;">아이폰은 일주일 넘게 안 들어오면 자동으로 풀립니다.<br>이름은 기억해 뒀어요.</div>
    </div>

    <!-- 가입 -->
    <div class="panel" id="panel-signup">
      <div class="fg"><label>이름</label><input type="text" id="su-name" placeholder="실명을 입력하세요"><div class="hint">선생님이 알아볼 수 있게 실명으로 적어주세요</div></div>
      <div class="fg"><label>학년</label><select id="su-grade" class="gsel"><option value="">학년 선택</option><option>초3</option><option>초4</option><option>초5</option><option>초6</option><option>중1</option><option>중2</option><option>중3</option><option>고1</option><option>고2</option><option>고3</option><option>기타</option></select></div>
      <div class="fg"><label>비밀번호 만들기</label><input type="password" id="su-pw" placeholder="사용할 비밀번호"></div>
      <div class="fg"><label>비밀번호 확인</label><input type="password" id="su-pw2" placeholder="비밀번호 다시 입력"></div>
      <button class="btn" id="su-btn" onclick="doSignup()">가입하기</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>
  <div class="admin-link"><a onclick="adminLogin()">선생님(관리자) 로그인</a></div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyDfQxi6q8xVUVgnvwON446Lnd-Becpwvbk",
  databaseURL: "https://kimbjmath-default-rtdb.firebaseio.com",
  projectId: "kimbjmath",
  appId: "1:664889936709:web:2df1494b0cd978c64e4c2c"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var db = firebase.database();
// 익명 인증을 LOCAL 지속성으로 → 앱 재시작 후에도 인증 세션 유지 (매번 로그아웃 방지)
window._authReady = (firebase.auth
  ? firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .catch(function(){})
      .then(function(){
        if(firebase.auth().currentUser) return firebase.auth().currentUser;
        return firebase.auth().signInAnonymously();
      })
      .catch(function(e){ console.error('익명 로그인 실패:', e&&e.code, e&&e.message); })
  : Promise.resolve());

// 클래스룸 데이터 접두사 (김병진=빈값, 선생님별 클래스룸은 sgh_ 등)
var CLS_PREFIX = "";
function CP(path){ return CLS_PREFIX + path; }
var CLASSROOM_AUTH_ENDPOINT = "https://kimbjmath-dashboard.vercel.app/api/classroom-auth";

// 자동 로그인
if(localStorage.getItem('class_uid')){ location.href='app.html'; }

// 마지막 이름 자동 채움
document.addEventListener('DOMContentLoaded', function(){
  var last = localStorage.getItem('class_last_name');
  if(last){ document.getElementById('li-name').value = last; }
});

function nameKey(name){ return name.trim().replace(/[.#$\[\]\/]/g,'_'); }
function showMsg(t,type){ var m=document.getElementById('msg'); m.textContent=t; m.className='msg '+(type||''); }

function switchTab(which){
  document.getElementById('tab-login').classList.toggle('on', which==='login');
  document.getElementById('tab-signup').classList.toggle('on', which==='signup');
  document.getElementById('panel-login').classList.toggle('on', which==='login');
  document.getElementById('panel-signup').classList.toggle('on', which==='signup');
  showMsg('');
}

// (구버전) 간단 해시 — 기존 가입자 마이그레이션 대조용으로만 유지
function hashPwLegacy(pw){
  var h=0; for(var i=0;i<pw.length;i++){ h=((h<<5)-h)+pw.charCodeAt(i); h|=0; }
  return 'h'+Math.abs(h)+'_'+pw.length;
}
// SHA-256 해시 (salt 포함) — 비밀번호 저장·대조용
var PW_SALT='kbjm.classroom.v1|';
function hashPw2(pw){
  var data=new TextEncoder().encode(PW_SALT+pw);
  return crypto.subtle.digest('SHA-256', data).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
  });
}
// 비밀번호 교체 시: 브라우저 콘솔에서 genLoginHash('새비밀번호') 실행 → 출력된 값을 아래 해시 상수에 붙여넣기
window.genLoginHash=function(pw){ hashPw2(pw).then(function(h){ console.log(h); }); };

function doSignup(){
  var name=document.getElementById('su-name').value.trim();
  var grade=document.getElementById('su-grade').value;
  var pw=document.getElementById('su-pw').value;
  var pw2=document.getElementById('su-pw2').value;
  if(!name){ showMsg('이름을 입력하세요','err'); return; }
  if(!grade){ showMsg('학년을 선택하세요','err'); return; }
  if(pw.length<4){ showMsg('비밀번호는 4자 이상으로 만들어주세요','err'); return; }
  if(pw!==pw2){ showMsg('비밀번호가 일치하지 않습니다','err'); return; }
  var btn=document.getElementById('su-btn'); btn.disabled=true;

  // 같은 이름+학년이 이미 있으면 뒤에 A,B,C... 를 붙여 구별
  (window._authReady || Promise.resolve()).then(function(){
  db.ref(CP('class_users')).once('value').then(function(snap){
    var all = snap.val() || {};
    // 같은 학년에서 같은 표시이름(원래이름 또는 원래이름+글자)이 쓰였는지 확인
    var sameGradeNames = {};
    Object.keys(all).forEach(function(k){
      var u=all[k];
      if(u && (u.grade||'')===grade && u.baseName===name){ sameGradeNames[u.name]=true; }
      // 옛 데이터(baseName 없음) 호환: name이 정확히 같고 학년 정보 없을 때도 충돌로 간주
      else if(u && !u.baseName && u.name===name && (u.grade||'')===grade){ sameGradeNames[u.name]=true; }
    });

    var finalName = name;
    if(sameGradeNames[name]){
      var suffixes='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      for(var i=0;i<suffixes.length;i++){
        if(!sameGradeNames[name+suffixes[i]]){ finalName=name+suffixes[i]; break; }
      }
    }

    var key=nameKey(finalName+'_'+grade);
    if(all[key]){ // 혹시 키 충돌(이론상 거의 없음)
      showMsg('잠시 후 다시 시도해 주세요','err'); btn.disabled=false; return;
    }
    var uid='u'+Date.now();
    var user={ uid:uid, name:finalName, baseName:name, grade:grade, pw:'', role:'student', createdAt:new Date().toISOString().slice(0,10) };

    var proceed=function(){
      hashPw2(pw).then(function(h){ user.pw=h;
      db.ref(CP('class_users/')+key).set(user).then(function(){
        localStorage.setItem('class_uid',uid);
        localStorage.setItem('class_name',finalName);
        localStorage.setItem('class_namekey',key);
        localStorage.setItem('class_role','student');
        localStorage.setItem('class_last_name',finalName);
        location.href='app.html';
      });
      });
    };

    if(finalName!==name){
      showMsg('같은 학년에 동명이인이 있어 "'+finalName+'"(으)로 가입돼요. 다음부터 이 이름으로 로그인하세요.','ok');
      btn.disabled=false;
      btn.textContent='"'+finalName+'"로 가입하기';
      btn.onclick=function(){ btn.disabled=true; proceed(); };
    } else {
      proceed();
    }
  }).catch(function(e){ showMsg('오류가 발생했습니다. 다시 시도해주세요.','err'); btn.disabled=false; });
  });
}

function doLogin(){
  var name=document.getElementById('li-name').value.trim();
  var grade=document.getElementById('li-grade').value;  // 선택사항
  var pw=document.getElementById('li-pw').value;
  if(!name||!pw){ showMsg('이름과 비밀번호를 입력하세요','err'); return; }
  var btn=document.getElementById('li-btn'); btn.disabled=true;

  (window._authReady || Promise.resolve()).then(function(){
  hashPw2(pw).then(function(ph2){
  db.ref(CP('class_users')).once('value').then(function(snap){
    var all=snap.val()||{};
    var phOld=hashPwLegacy(pw);
    // 이름(표시이름 또는 원래이름) 일치하는 후보 모두
    var candidates=[];
    Object.keys(all).forEach(function(k){
      var u=all[k]; if(!u) return;
      if(u.name===name || u.baseName===name) candidates.push({key:k,u:u});
    });
    if(!candidates.length){ showMsg('가입 정보가 없어요. 이름을 확인하거나 "처음이에요"로 가입해 주세요.','err'); btn.disabled=false; return; }
    // 비번 맞는 후보
    var hit=candidates.filter(function(c){ return c.u.pw===ph2 || c.u.pw===phOld; });
    if(!hit.length){ showMsg('비밀번호가 맞지 않습니다','err'); btn.disabled=false; return; }

    var pick;
    if(hit.length===1){
      pick = hit[0];   // 한 명이면 학년 없이 바로 로그인
    } else {
      // 이름+비번이 겹치는 사람이 여럿 → 학년으로 구분 필요
      if(!grade){
        showMsg('같은 이름의 친구가 있어요. 학년을 선택해 주세요.','err');
        btn.disabled=false; return;
      }
      var byGrade = hit.filter(function(c){ return (c.u.grade||'')===grade; });
      if(!byGrade.length){ showMsg('그 학년의 가입 정보가 없어요. 학년을 확인해 주세요.','err'); btn.disabled=false; return; }
      // 학년까지 같고 이름 정확히 일치하는 걸 우선
      pick = byGrade.find(function(c){ return c.u.name===name; }) || byGrade[0];
    }
    var u=pick.u;
    localStorage.setItem('class_uid',u.uid);
    localStorage.setItem('class_name',u.name);
    localStorage.setItem('class_namekey',pick.key);
    localStorage.setItem('class_role',u.role||'student');
    localStorage.setItem('class_last_name',u.name);
    // 구버전 해시로 로그인한 경우 새 해시로 자동 교체 (다음부터는 새 방식)
    if(u.pw===phOld && u.pw!==ph2){ try{ db.ref(CP('class_users/')+pick.key+'/pw').set(ph2); }catch(e){} }
    location.href='app.html';
  }).catch(function(e){ showMsg('오류가 발생했습니다','err'); btn.disabled=false; });
  });
  });
}

// 관리자(선생님) 로그인 — 비밀번호 확인은 대시보드 API에서 처리
function adminLogin(){
  var id=prompt('관리자 아이디');
  if(id===null) return;
  var pw=prompt('관리자 비밀번호');
  if(pw===null) return;
  fetch(CLASSROOM_AUTH_ENDPOINT, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'login', id:id, pw:pw})
  }).then(function(res){
    if(!res.ok) throw new Error('login failed');
    return res.json();
  }).then(function(r){
    if(!r || !r.ok || !r.token) throw new Error('login failed');
    localStorage.setItem('class_uid', r.uid || r.role);
    localStorage.setItem('class_name', r.name || id);
    localStorage.setItem('class_namekey', r.key || r.name || id);
    localStorage.setItem('class_role', r.role);
    localStorage.setItem('class_admin_token', r.token);
    location.href='app.html';
  }).catch(function(){
    showMsg('관리자 정보가 맞지 않습니다','err');
  });
}
</script>
</body>
</html>

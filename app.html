<style>
  :root{
    --deep:#0f2a24; --teal:#1f6f5c; --teal2:#2a8a72;
    --gold:#c79a3c; --gold-soft:#f6efdf; --cream:#f7f8f6; --cream2:#eef1ee;
    --line:#e3e8e4; --ink:#15201d; --muted:#7a857f; --red:#c0392b;
    --sans:'Pretendard','Apple SD Gothic Neo',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh;padding-bottom:80px;}
  /* 헤더 */
  .top{position:sticky;top:0;z-index:50;background:var(--deep);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
  .top .ti{font-size:17px;font-weight:800;letter-spacing:-.4px;}
  .top .ti .mark{display:inline-block;width:9px;height:9px;background:var(--gold);border-radius:50%;margin-right:7px;}
  .top .who{font-size:12.5px;color:rgba(255,255,255,.7);}
  .top .who b{color:#fff;font-weight:700;}
  .logout{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:20px;padding:6px 13px;font-size:12px;cursor:pointer;font-family:var(--sans);}
  /* 반 선택 바 */
  .classbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;overflow-x:auto;align-items:center;}
  .classbar::-webkit-scrollbar{display:none;}
  .class-chip{flex-shrink:0;background:var(--cream);border:1.5px solid transparent;border-radius:30px;padding:8px 16px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:.2s;white-space:nowrap;}
  .class-chip.on{background:var(--teal);color:#fff;}
  .wrap{max-width:680px;margin:0 auto;padding:16px 14px;}
  /* 탭 */
  .vtabs{display:flex;gap:6px;margin-bottom:16px;background:#fff;padding:5px;border-radius:12px;border:1px solid var(--line);}
  .vtab{flex:1;text-align:center;padding:10px;font-size:14px;font-weight:700;color:var(--muted);border-radius:9px;cursor:pointer;transition:.2s;}
  .vtab.on{background:var(--teal);color:#fff;}
  /* 카드 공통 */
  .post{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
  .post-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;}
  .avatar.teacher{background:var(--gold);}
  .post-meta{flex:1;min-width:0;}
  .post-meta .nm{font-size:14px;font-weight:700;}
  .post-meta .tm{font-size:11.5px;color:var(--muted);}
  .post-body{font-size:14.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;}
  .post-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .post-imgs img{width:84px;height:84px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--line);}
  .post-file{display:inline-flex;align-items:center;gap:7px;margin-top:10px;background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:13px;color:var(--ink);text-decoration:none;font-weight:600;}
  .badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;}
  .badge.q{background:#fdeceа;background:var(--gold-soft);color:var(--gold);}
  .badge.done{background:#e6f4ee;color:var(--teal);}
  .badge.wait{background:#fbeaea;color:var(--red);}
  /* 답변 */
  .answer{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
  .answer .alabel{font-size:12px;font-weight:800;color:var(--teal);margin-bottom:7px;display:flex;align-items:center;gap:5px;}
  /* 작성 영역 */
  .composer{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;}
  .composer textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:14.5px;font-family:var(--sans);resize:vertical;min-height:70px;}
  .composer textarea:focus{outline:none;border-color:var(--teal);}
  .comp-actions{display:flex;gap:8px;margin-top:10px;align-items:center;}
  .icon-btn{background:var(--cream);border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);color:var(--ink);}
  .send-btn{margin-left:auto;background:var(--teal);color:#fff;border:none;border-radius:30px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans);}
  .send-btn:disabled{opacity:.5;}
  .preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .preview .pv{position:relative;}
  .preview img{width:64px;height:64px;object-fit:cover;border-radius:8px;}
  .preview .del{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1;}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:50px 20px;}
  /* 모달 */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .modal.on{display:flex;}
  .modal-box{background:#fff;border-radius:16px;padding:24px;max-width:400px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal-box h3{font-size:18px;font-weight:800;margin-bottom:16px;}
  .modal-photo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;align-items:center;justify-content:center;padding:16px;}
  .modal-photo.on{display:flex;}
  .modal-photo img{max-width:100%;max-height:90vh;object-fit:contain;border-radius:8px;}
  .modal-photo .close-x{position:absolute;top:16px;right:20px;color:#fff;font-size:32px;cursor:pointer;}
  /* 관리자: 학생/반 관리 */
  .adm-section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .adm-section h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
  .mini-btn{background:var(--teal);color:#fff;border:none;border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--sans);}
  .stu-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--cream2);}
  .stu-row:last-child{border-bottom:none;}
  .stu-row .nm{font-size:14px;font-weight:600;flex:1;}
  .stu-row .tag{font-size:11px;color:var(--muted);}
  .chk{width:20px;height:20px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:12px 22px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:300;opacity:0;transition:.3s;pointer-events:none;}
  .toast.on{opacity:1;}
  input[type=text],input[type=password],select{font-family:var(--sans);}
  .fld{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:15px;margin-bottom:12px;}
  .fld:focus{outline:none;border-color:var(--teal);}
</style>
</head>

<script>

// ===== 텔레그램 알림 (선생님에게) =====

function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); setTimeout(function(){el.classList.remove('on');},2000); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function initial(name){ return (name||'?').trim().charAt(0); }
function fmtTime(iso){
  if(!iso) return '';
  var d=new Date(iso), now=new Date();
  var sameDay=d.toDateString()===now.toDateString();
  var hh=('0'+d.getHours()).slice(-2), mm=('0'+d.getMinutes()).slice(-2);
  if(sameDay) return '오늘 '+hh+':'+mm;
  return (d.getMonth()+1)+'/'+d.getDate()+' '+hh+':'+mm;
}

// 사진 압축 (focus-study 검증 방식)
function compressImage(file, cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var max=900, w=img.width, h=img.height;
      if(w>h){ if(w>max){ h=h*max/w; w=max; } }
      else { if(h>max){ w=w*max/h; h=max; } }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.6));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function openPhoto(src){ document.getElementById('photoBig').src=src; document.getElementById('photoModal').classList.add('on'); }
function closePhoto(){ document.getElementById('photoModal').classList.remove('on'); }
function openModal(html){ document.getElementById('modalBox').innerHTML=html; document.getElementById('modal').classList.add('on'); }
function closeModal(){ document.getElementById('modal').classList.remove('on'); }

// ===== 데이터 로드 =====
function loadAll(cb){
  db.ref('class_classes').once('value').then(function(snap){
    CLASSES=snap.val()||{};
    return db.ref('class_signups').once('value').then(function(s3){ SIGNUPS=s3.val()||{}; });
  }).then(function(){
    if(isAdmin){
      return db.ref('class_users').once('value').then(function(s2){ USERS=s2.val()||{}; });
    }
  }).then(function(){
    if(cb) cb();
  });
}

// 반 정보 실시간 구독 (승인 상태/멤버 변경이 자동 반영되도록)
var _classesLive = false;
function startClassesLive(){
  if(_classesLive) return;
  _classesLive = true;
  db.ref('class_classes').on('value', function(snap){
    CLASSES = snap.val()||{};
    if(document.getElementById('modal') && document.getElementById('modal').classList.contains('on')) return;
    var ta = document.getElementById('comp-text');
    if(ta && ta.value && ta.value.trim().length>0) return;
    renderClassBar();
    renderMain();
  });
  db.ref('class_signups').on('value', function(snap){
    SIGNUPS = snap.val()||{};
    if(document.getElementById('modal') && document.getElementById('modal').classList.contains('on')) return;
    var ta = document.getElementById('comp-text');
    if(ta && ta.value && ta.value.trim().length>0) return;
    // 관리자면 반 관리 화면 갱신, 학생이면 신청 화면 갱신
    if(isAdmin && CUR_TAB==='manage'){ renderManage(); }
    else if(!isAdmin && !CURRENT_CLASS){ renderClassJoin(); }
  });
  if(isAdmin){
    db.ref('class_users').on('value', function(snap){ USERS = snap.val()||{}; });
  }
}

// 학생이 속한 반만 / 관리자는 전체
function myClasses(){
  var arr=[];
  Object.keys(CLASSES).forEach(function(cid){
    var c=CLASSES[cid]; if(!c) return;
    if(isAdmin){ arr.push(Object.assign({id:cid},c)); }
    else if(c.members && c.members[MY_KEY]){ arr.push(Object.assign({id:cid},c)); }
  });
  arr.sort(function(a,b){ return (a.createdAt||'').localeCompare(b.createdAt||''); });
  return arr;
}

function renderClassBar(){
  var bar=document.getElementById('classbar');
  var list=myClasses();
  var html='';
  if(isAdmin && CURRENT_CLASS){
    html+='<div class="class-chip" onclick="backToClassPicker()" style="background:var(--cream);color:var(--teal);">‹ 반 목록</div>';
  }
  list.forEach(function(c){
    html+='<div class="class-chip'+(CURRENT_CLASS===c.id?' on':'')+'" onclick="selectClass(\''+c.id+'\')">'+esc(c.name)+'</div>';
  });
  if(isAdmin){
    html+='<div class="class-chip" onclick="openNewClass()" style="background:var(--gold-soft);color:var(--gold);">+ 반 만들기</div>';
  } else {
    html+='<div class="class-chip" onclick="showClassJoin()" style="background:var(--gold-soft);color:var(--gold);">+ 반 신청</div>';
  }
  bar.innerHTML=html;
}

// 학생: 반 신청 화면으로 전환
function showClassJoin(){
  CURRENT_CLASS=null;
  renderClassBar();
  renderClassJoin();
}

function selectClass(cid){
  CURRENT_CLASS=cid;
  CUR_TAB='feed';
  renderClassBar();
  loadPosts();
}

// 학생: 신청 가능한 반 목록 화면
function renderClassJoin(){
  // 내가 이미 어느 반의 멤버인지
  var myMemberClasses = [];
  Object.keys(CLASSES).forEach(function(cid){
    var c=CLASSES[cid];
    if(c.members && c.members[MY_KEY]) myMemberClasses.push(c.name);
  });
  // 가입 신청 상태
  var pending = (SIGNUPS && SIGNUPS[MY_KEY]) ? true : false;

  var html = '';
  if(myMemberClasses.length){
    html += '<div style="padding:4px 2px 14px;font-size:14px;color:var(--muted);">참여 중인 반: '+esc(myMemberClasses.join(', '))+'</div>';
  }

  if(pending){
    html += '<div class="post" style="text-align:center;padding:30px 16px;">'
      + '<div style="font-size:34px;margin-bottom:10px;">⏳</div>'
      + '<div style="font-weight:700;font-size:16px;margin-bottom:6px;">가입 신청 완료</div>'
      + '<div style="font-size:14px;color:var(--muted);">선생님이 반에 배정해 주실 때까지<br>잠시 기다려 주세요.</div></div>';
  } else if(myMemberClasses.length===0){
    html += '<div class="post" style="text-align:center;padding:30px 16px;">'
      + '<div style="font-size:34px;margin-bottom:10px;">🙋</div>'
      + '<div style="font-weight:700;font-size:16px;margin-bottom:6px;">아직 들어간 반이 없어요</div>'
      + '<div style="font-size:14px;color:var(--muted);margin-bottom:18px;">가입 신청을 하면 선생님이<br>반에 배정해 주세요.</div>'
      + '<button class="send-btn" style="margin:0;" onclick="requestSignup()">가입 신청하기</button></div>';
  } else {
    // 이미 반이 있는 학생이 추가로 신청하고 싶을 때
    html += '<div class="post" style="text-align:center;padding:24px 16px;">'
      + '<div style="font-size:14px;color:var(--muted);margin-bottom:14px;">다른 반에도 들어가야 하나요?</div>'
      + '<button class="send-btn" style="margin:0;" onclick="requestSignup()">가입 신청하기</button></div>';
  }
  document.getElementById('main').innerHTML = html;
}

// 학생: 가입 신청 (반 선택 없이)
function requestSignup(){
  db.ref('class_signups/'+MY_KEY).set({ name:MY_NAME, uid:UID, at:new Date().toISOString() }).then(function(){
    if(!SIGNUPS) SIGNUPS={};
    SIGNUPS[MY_KEY]={ name:MY_NAME, uid:UID };
    notifyTelegram('🙋 가입 신청\n'+MY_NAME+' 학생이 가입 신청했어요. 반에 배정해 주세요.');
    toast('신청했어요. 선생님이 반에 배정해 주실 거예요');
    renderClassJoin();
  }).catch(function(){ toast('신청 실패. 다시 시도해 주세요'); });
}

var _postsRef = null;  // 현재 구독 중인 Firebase 참조
function loadPosts(){
  // 이전 반 실시간 구독 해제
  if(_postsRef){ try{ _postsRef.off(); }catch(e){} _postsRef=null; }
  if(!CURRENT_CLASS){ document.getElementById('main').innerHTML='<div class="empty">반을 선택해 주세요.</div>'; return; }
  _postsRef = db.ref('class_posts/'+CURRENT_CLASS);
  // 실시간 감지: 새 글/답변/삭제가 생기면 자동 반영
  _postsRef.on('value', function(snap){
    POSTS = snap.val()||{};
    // 작성칸에 입력 중이면 화면을 다시 안 그림(깜빡임/입력 손실 방지)
    var ta = document.getElementById('comp-text');
    if(ta && ta.value && ta.value.trim().length>0){ return; }
    // 모달(답변 작성 등)이 열려 있으면 다시 안 그림
    if(document.getElementById('modal') && document.getElementById('modal').classList.contains('on')){ return; }
    renderMain();
  });
}

// 관리자: 반 선택 화면 (반 카드 목록)
function renderAdminClassPicker(){
  var list = myClasses();

  list.forEach(function(c){

      +'<div><div style="font-size:16px;font-weight:700;color:var(--deep);">'+esc(c.name)+'</div>'
      +'<div style="font-size:12px;color:var(--muted);margin-top:4px;">학생 '+memberCnt+'명</div></div>'

// 관리자: 현재 반에서 반 목록으로 돌아가기
function backToClassPicker(){

  CUR_TAB='feed';
  renderClassBar();

}

// ===== 메인 렌더 =====
function renderMain(){
  if(isAdmin && CUR_TAB==='manage'){ renderManage(); return; }
  if(!CURRENT_CLASS){
    if(isAdmin){
      renderAdminClassPicker();  // 관리자: 반 선택 화면 먼저

    }

  }
  var html='';
  // 탭
  html+='<div class="vtabs">';

  html+='<div class="vtab'+(CUR_TAB==='qna'?' on':'')+'" onclick="setTab(\'qna\')">❓ 질문</div>';
  html+='<div class="vtab'+(CUR_TAB==='hw'?' on':'')+'" onclick="setTab(\'hw\')">'+(isAdmin?'📋 숙제 현황':'📋 내 숙제')+'</div>';
  html+='<div class="vtab'+(CUR_TAB==='planner'?' on':'')+'" onclick="setTab(\'planner\')">📅 플래너</div>';

  html+='</div>';

  // 숙제 탭 — 별도 렌더
  if(CUR_TAB==='hw'){
    document.getElementById('main').innerHTML = html;
    if(isAdmin) renderHwAdmin();
    else renderHwStudent();
    return;
  }

  // 플래너 탭은 별도 렌더
  if(CUR_TAB==='planner'){
    document.getElementById('main').innerHTML = html;
    if(isAdmin) renderPlannerAdmin();
    else renderPlannerStudent();
    return;
  }

  // 작성 영역
  if(CUR_TAB==='feed' && isAdmin){
    html+=composerHtml('자료를 올려보세요 (공지, 설명, 숙제 안내 등)','자료 올리기','feed');
  } else if(CUR_TAB==='qna' && !isAdmin){
    html+=composerHtml('궁금한 문제를 적고, 사진을 올려보세요','질문하기','qna');
  }

  // 게시물 목록
  var arr=Object.keys(POSTS).map(function(id){ return Object.assign({id:id},POSTS[id]); });
  var filtered=arr.filter(function(p){ return p.type===(CUR_TAB==='feed'?'feed':'qna'); });
  filtered.sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });

  if(filtered.length===0){
    html+='<div class="empty">'+(CUR_TAB==='feed'?'아직 올라온 자료가 없어요.':'아직 질문이 없어요.')+'</div>';
  } else {
    filtered.forEach(function(p){ html+=postHtml(p); });
  }
  document.getElementById('main').innerHTML=html;
}

function composerHtml(placeholder,btnLabel,type){
  var h='<div class="composer">';
  h+='<textarea id="comp-text" placeholder="'+placeholder+'"></textarea>';
  h+='<div class="preview" id="comp-preview"></div>';
  h+='<div class="comp-actions">';
  h+='<button class="icon-btn" onclick="document.getElementById(\'img-input\').click()">📷 사진</button>';
  if(type==='feed') h+='<button class="icon-btn" onclick="openLinkInput()">🔗 파일 링크</button>';
  h+='<button class="send-btn" id="send-btn" onclick="submitPost(\''+type+'\')">'+btnLabel+'</button>';
  h+='</div>';
  h+='<input type="file" id="img-input" accept="image/*" multiple style="display:none" onchange="onPickImgs(event)">';

function postHtml(p){
  var isTeacher=(p.role==='admin');
  var h='<div class="post">';
  h+='<div class="post-head">';
  h+='<div class="avatar'+(isTeacher?' teacher':'')+'">'+esc(initial(p.author))+'</div>';
  h+='<div class="post-meta"><div class="nm">'+esc(p.author)+(isTeacher?' <span style="font-size:11px;color:var(--gold);">선생님</span>':'')+'</div><div class="tm">'+fmtTime(p.createdAt)+'</div></div>';
  if(p.type==='qna'){
    h+= p.answer ? '<span class="badge done">답변완료</span>' : '<span class="badge wait">답변대기</span>';
  }
  if(isAdmin || p.uid===UID){
    h+='<button class="icon-btn" style="padding:5px 9px;margin-left:6px;" onclick="openEditPost(\''+p.id+'\')">✏️</button>';
    h+='<button class="icon-btn" style="padding:5px 9px;margin-left:4px;" onclick="deletePost(\''+p.id+'\')">🗑</button>';
  }
  h+='</div>';
  if(p.text) h+='<div class="post-body">'+esc(p.text)+'</div>';
  if(p.imgs && p.imgs.length){
    h+='<div class="post-imgs">';
    p.imgs.forEach(function(src){ h+='<img src="'+src+'" onclick="openPhoto(this.src)">'; });
    h+='</div>';
  }
  if(p.file && (p.file.url || p.file.data)){
    var furl = p.file.url || p.file.data;
    h+='<a class="post-file" href="'+furl+'" target="_blank" rel="noopener">🔗 '+esc(p.file.name)+'</a>';
  }
  // 질문의 답변
  if(p.type==='qna'){
    if(p.answer){
      h+='<div class="answer"><div class="alabel">✏️ 선생님 답변</div>';
      if(p.answer.text) h+='<div class="post-body">'+esc(p.answer.text)+'</div>';
      if(p.answer.imgs && p.answer.imgs.length){
        h+='<div class="post-imgs">';
        p.answer.imgs.forEach(function(src){ h+='<img src="'+src+'" onclick="openPhoto(this.src)">'; });
        h+='</div>';
      }
      h+='</div>';
    }
    if(isAdmin){
      h+='<div style="margin-top:10px;"><button class="icon-btn" onclick="openAnswer(\''+p.id+'\')">'+(p.answer?'답변 수정':'답변 달기')+'</button></div>';
    }
  }
  h+='</div>';
  return h;
}

function setTab(t){ CUR_TAB=t; uploadImgs=[]; uploadFile=null; plannerImgs=[]; if(t==='planner'){ loadPlanners(renderMain); } else if(t==='hw'){ loadHomework(renderMain); } else { renderMain(); } }

// ===== 숙제 연동 (대시보드 bjm_homework ↔ 클래스룸) =====
var HW_LIST = [];      // 대시보드 숙제 (bjm_homework)
var HW_STUDENTS = [];  // 대시보드 학생 (bjm_students) — classKey 매칭용
var HW_DONE = {};      // 완료 체크 (class_hw_done) {hwId:{classKey:{done,at}}}

function loadHomework(cb){
  var done=0; function step(){ done++; if(done>=3 && cb) cb(); }
  try{
    db.ref('bjm_homework').once('value').then(function(s){ var v=s.val(); HW_LIST = v? (Array.isArray(v)?v:Object.values(v)) : []; step(); }).catch(step);
    db.ref('bjm_students').once('value').then(function(s){ var v=s.val(); HW_STUDENTS = v? (Array.isArray(v)?v:Object.values(v)) : []; step(); }).catch(step);
    db.ref('class_hw_done').once('value').then(function(s){ HW_DONE = s.val()||{}; step(); }).catch(step);
  }catch(e){ if(cb) cb(); }
}

// 내 classKey에 연결된 대시보드 학생 id 찾기
function mySid(){
  var me = HW_STUDENTS.find(function(st){ return st.classKey===MY_KEY; });
  return me ? me.id : null;
}
// classKey로 학생 id
function sidOfClassKey(key){
  var st = HW_STUDENTS.find(function(s){ return s.classKey===key; });
  return st? st.id : null;
}

// 이 학생(sid)에게 해당하는 숙제인지 (개인 숙제 sid 일치 OR 반 숙제 gid가 학생 반)
function hwForSid(h, sid){
  if(!sid) return false;
  if(h.sid && h.sid===sid) return true;
  return false;
}

function isHwDone(hwId, key){
  return !!(HW_DONE[hwId] && HW_DONE[hwId][key] && HW_DONE[hwId][key].done);
}

// 학생: 내 숙제 목록
function renderHwStudent(){
  var main=document.getElementById('main');
  var sid = mySid();
  if(!sid){
    main.innerHTML += '<div class="empty">아직 선생님과 연결되지 않았어요.<br>선생님이 대시보드에서 계정을 연결하면<br>숙제가 여기 표시됩니다.</div>';
    return;
  }
  var mine = HW_LIST.filter(function(h){ return hwForSid(h, sid); });
  // 미완료 먼저, 그다음 완료. 마감일 순
  mine.sort(function(a,b){ return (a.due||'').localeCompare(b.due||''); });
  var doneCnt = mine.filter(function(h){ return isHwDone(h.id, MY_KEY); }).length;

  var html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'
    +'<span style="font-size:14px;font-weight:700;">받은 숙제</span>'
    +'<span style="font-size:13px;color:var(--teal);font-weight:700;">'+doneCnt+' / '+mine.length+' 완료</span></div>';

  if(!mine.length){ main.innerHTML += html + '<div class="empty">아직 받은 숙제가 없어요.</div>'; return; }

  var today = todayStr();
  // 미완료 → 완료 순
  mine.sort(function(a,b){
    var da=isHwDone(a.id,MY_KEY)?1:0, db_=isHwDone(b.id,MY_KEY)?1:0;
    if(da!==db_) return da-db_;
    return (a.due||'').localeCompare(b.due||'');
  });

  mine.forEach(function(h){
    var done = isHwDone(h.id, MY_KEY);
    var info = [h.book, h.unit].filter(Boolean).join(' · ');
    var range = h.range||'';
    var overdue = h.due && h.due<today && !done;
    if(done){
      var at = (HW_DONE[h.id][MY_KEY].at||'').replace('T',' ').slice(0,16);
      html += '<div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;opacity:.6;">'
        +'<div style="display:flex;align-items:flex-start;gap:10px;">'
        +'<div style="width:22px;height:22px;border-radius:6px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;">✓</div>'
        +'<div style="flex:1;min-width:0;">'
        +'<div style="font-size:13.5px;font-weight:700;text-decoration:line-through;">'+esc(info||h.name||'숙제')+'</div>'
        +(range?'<div style="font-size:12px;color:var(--muted);margin-top:3px;">'+esc(range)+(h.due?' · '+h.due+'까지':'')+'</div>':'')
        +'<div style="font-size:11px;color:var(--teal);margin-top:4px;">완료함'+(at?' · '+at:'')+'</div>'
        +'<button class="icon-btn" style="margin-top:8px;padding:5px 12px;font-size:12px;" onclick="toggleHwDone(\''+h.id+'\',false)">완료 취소</button>'
        +'</div></div></div>';
    } else {
      html += '<div style="background:#fff;border:1.5px solid '+(overdue?'#c0392b':'var(--gold)')+';border-radius:14px;padding:14px;margin-bottom:10px;">'
        +'<div style="display:flex;align-items:flex-start;gap:10px;">'
        +'<div style="width:22px;height:22px;border-radius:6px;border:2px solid '+(overdue?'#c0392b':'var(--gold)')+';flex-shrink:0;margin-top:1px;"></div>'
        +'<div style="flex:1;min-width:0;">'
        +'<div style="font-size:13.5px;font-weight:700;">'+esc(info||h.name||'숙제')+'</div>'
        +(range?'<div style="font-size:12px;color:var(--muted);margin-top:3px;">'+esc(range)+(h.due?' · <span style="color:'+(overdue?'#c0392b':'var(--muted)')+';font-weight:600;">'+h.due+'까지</span>':'')+'</div>':'')
        +'<button class="send-btn" style="margin-top:10px;width:100%;" onclick="toggleHwDone(\''+h.id+'\',true)">완료했어요 체크</button>'
        +'</div></div></div>';
    }
  });
  main.innerHTML += html;
}

function toggleHwDone(hwId, done){
  var ref = db.ref('class_hw_done/'+hwId+'/'+MY_KEY);
  if(done){
    var rec = { done:true, at:new Date().toISOString(), name:MY_NAME };
    ref.set(rec).then(function(){
      if(!HW_DONE[hwId]) HW_DONE[hwId]={};
      HW_DONE[hwId][MY_KEY]=rec;
      notifyTelegram('✅ 숙제 완료\n'+MY_NAME+' 학생');
      toast('완료 체크했어요'); renderMain();
    }).catch(function(){ toast('실패. 다시 시도해 주세요'); });
  } else {
    ref.set({ done:false, at:new Date().toISOString(), name:MY_NAME }).then(function(){
      if(!HW_DONE[hwId]) HW_DONE[hwId]={};
      HW_DONE[hwId][MY_KEY]={done:false};
      toast('완료를 취소했어요'); renderMain();
    }).catch(function(){ toast('실패. 다시 시도해 주세요'); });
  }
}

// 관리자: 이 반 학생들의 숙제 현황
function renderHwAdmin(){
  var main=document.getElementById('main');
  if(!CURRENT_CLASS){ main.innerHTML += '<div class="empty">반을 선택해 주세요.</div>'; return; }
  var members = (CLASSES[CURRENT_CLASS] && CLASSES[CURRENT_CLASS].members) ? CLASSES[CURRENT_CLASS].members : {};
  var memberKeys = Object.keys(members);
  if(!memberKeys.length){ main.innerHTML += '<div class="empty">이 반에 학생이 없어요.</div>'; return; }

  var html = '<div style="font-size:12px;color:var(--muted);margin-bottom:12px;">학생별로 받은 숙제와 완료 여부예요. 완료 체크는 학생이 합니다.</div>';

  memberKeys.forEach(function(k){
    var sid = sidOfClassKey(k);
    var name = members[k].name || k;
    var mine = sid ? HW_LIST.filter(function(h){ return hwForSid(h, sid); }) : [];
    var doneCnt = mine.filter(function(h){ return isHwDone(h.id, k); }).length;

    html += '<div class="post" style="padding:12px 14px;">';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:'+(mine.length?'8px':'0')+';">'
      +'<span style="font-weight:700;font-size:14px;">'+esc(name)+'</span>'
      +'<span style="font-size:12px;color:'+(!sid?'var(--gold)':(mine.length&&doneCnt===mine.length?'var(--teal)':'var(--muted)'))+';">'
      +(!sid?'미연결':(doneCnt+' / '+mine.length+' 완료'))+'</span></div>';
    if(!sid){
      html += '<div style="font-size:12px;color:var(--muted);">대시보드에서 이 학생과 계정을 연결하면 숙제가 표시됩니다.</div>';
    } else if(!mine.length){
      html += '<div style="font-size:12px;color:var(--muted);">받은 숙제가 없어요.</div>';
    } else {
      mine.sort(function(a,b){ return (a.due||'').localeCompare(b.due||''); });
      mine.forEach(function(h){
        var done=isHwDone(h.id,k);
        var info=[h.book,h.unit].filter(Boolean).join(' · ')||h.name||'숙제';
        html += '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;">'
          +'<span style="flex-shrink:0;color:'+(done?'var(--teal)':'var(--muted)')+';">'+(done?'✓':'○')+'</span>'
          +'<span style="flex:1;min-width:0;'+(done?'text-decoration:line-through;color:var(--muted);':'')+'">'+esc(info)+(h.range?' ('+esc(h.range)+')':'')+'</span>'
          +(h.due?'<span style="flex-shrink:0;font-size:11px;color:var(--muted);">'+h.due+'</span>':'')
          +'</div>';
      });
    }
    html += '</div>';
  });
  main.innerHTML += html;
}

function fmtDate(d){
  var y=d.getFullYear();
  var m=('0'+(d.getMonth()+1)).slice(-2);
  var dd=('0'+d.getDate()).slice(-2);
  return y+'-'+m+'-'+dd;
}
function todayStr(){ return fmtDate(new Date()); }

// 플래너 전용 '오늘' — 새벽 4시 이전은 전날로 간주
// (학생들이 새벽에 그날 공부를 정리해 올리는 경우가 많아서)
function plannerToday(){
  var d = new Date();
  if(d.getHours() < 4){ d.setDate(d.getDate() - 1); }
  return fmtDate(d);
}

function loadPlanners(cb){
  db.ref('class_planner').once('value').then(function(snap){
    PLANNERS = snap.val()||{};
    if(cb) cb();
  }).catch(function(){ if(cb) cb(); });
}

// 학생: 오늘 플래너 작성 + 내 지난 플래너
function renderPlannerStudent(){
  var today = plannerToday();
  var mine = PLANNERS[MY_KEY] || {};
  var todayP = mine[today];
  var html = '';

  if(todayP && !_plannerEditMode){
    // 오늘 이미 제출함 → 보여주고 수정 가능
    html += '<div class="post" style="border-left:3px solid var(--teal);">';
    html += '<div style="font-weight:700;margin-bottom:8px;">📅 오늘 플래너 ('+today+') ✓ 제출완료</div>';
    html += plannerBody(todayP);
    html += '<button class="icon-btn" style="margin-top:10px;" onclick="editPlannerToday()">수정하기</button>';
    html += '</div>';
  } else {
    // 오늘 작성 폼 (신규 또는 수정)
    html += plannerForm(_plannerEditMode ? todayP : null);
  }

  // 지난 플래너 (작성한 전체)

function addPlannerItem(){

  var amt=(document.getElementById('pl-amount').value||'').trim();
  if(!subj && !amt){ toast('과목이나 분량을 적어주세요'); return; }
  _plannerItems.push({ place:_plannerPlace, subject:subj, amount:amt });

  document.getElementById('pl-amount').value='';
  renderPlannerItems();
}
function removePlannerItem(i){ _plannerItems.splice(i,1); renderPlannerItems(); }
function renderPlannerItems(){
  var box=document.getElementById('pl-items'); if(!box) return;
  if(!_plannerItems.length){ box.innerHTML=''; return; }
  box.innerHTML = _plannerItems.map(function(it,i){
    var tagBg = it.place==='학원' ? 'var(--teal)' : 'var(--gold)';
    return '<div style="display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;">'
      +'<span style="flex-shrink:0;font-size:11px;font-weight:700;color:#fff;background:'+tagBg+';padding:2px 8px;border-radius:20px;">'+it.place+'</span>'
      +'<span style="flex:1;font-size:13px;min-width:0;">'+(it.subject?'<b>'+esc(it.subject)+'</b> ':'')+esc(it.amount||'')+'</span>'
      +'<button onclick="removePlannerItem('+i+')" style="flex-shrink:0;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;">×</button>'
      +'</div>';
  }).join('');

function plannerBody(p){
  var h = '<div style="font-size:13.5px;line-height:1.7;">';
  // 새 구조: items 배열
  if(p.items && p.items.length){
    p.items.forEach(function(it){
      var tagBg = it.place==='학원' ? 'var(--teal)' : 'var(--gold)';
      h += '<div style="display:flex;align-items:center;gap:7px;margin-bottom:4px;">'
        +'<span style="flex-shrink:0;font-size:10.5px;font-weight:700;color:#fff;background:'+tagBg+';padding:1px 7px;border-radius:20px;">'+esc(it.place||'')+'</span>'
        +'<span>'+(it.subject?'<b>'+esc(it.subject)+'</b> ':'')+esc(it.amount||'')+'</span></div>';
    });
  } else {
    // 옛 구조 호환 (subject/amount 단일)
    if(p.subject) h += '<div><b>과목</b> · '+esc(p.subject)+'</div>';
    if(p.amount) h += '<div><b>분량</b> · '+esc(p.amount)+'</div>';
  }
  if(p.achieve) h += '<div style="margin-top:4px;"><b>달성도</b> · '+esc(p.achieve)+'</div>';
  if(p.note) h += '<div style="margin-top:4px;white-space:pre-wrap;color:var(--ink2);">'+esc(p.note)+'</div>';
  h += '</div>';
  if(p.imgs && p.imgs.length){
    h += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">';
    p.imgs.forEach(function(src){ h+='<img src="'+src+'" style="width:80px;height:80px;object-fit:cover;border-radius:8px;cursor:pointer;" onclick="openPhoto(this.src)">'; });
    h += '</div>';
  }
  return h;
}

function onPickPlannerImg(ev){
  var files=ev.target.files; if(!files||!files.length) return;
  var remain=files.length;
  for(var i=0;i<files.length;i++){
    compressImage(files[i], function(b64){ plannerImgs.push(b64); remain--; if(remain===0) renderPlannerPreview(); });
  }
}
function renderPlannerPreview(){
  var box=document.getElementById('pl-preview'); if(!box) return;
  var h=''; plannerImgs.forEach(function(src,i){ h+='<div class="pv" style="position:relative;"><img src="'+src+'" style="width:64px;height:64px;object-fit:cover;border-radius:6px;"><button onclick="removePlannerImg('+i+')" style="position:absolute;top:-6px;right:-6px;background:#000;color:#fff;border:none;border-radius:50%;width:18px;height:18px;cursor:pointer;">×</button></div>'; });
  box.innerHTML=h;
  var c=document.getElementById('pl-img-count'); if(c) c.textContent=plannerImgs.length?plannerImgs.length+'장 첨부됨':'';
}
function removePlannerImg(i){ plannerImgs.splice(i,1); renderPlannerPreview(); }

function submitPlanner(){
  // 입력칸에 남아있는 항목도 자동 포함
  var subj=(document.getElementById('pl-subject').value||'').trim();
  var amt=(document.getElementById('pl-amount').value||'').trim();
  if(subj || amt){ _plannerItems.push({ place:_plannerPlace, subject:subj, amount:amt }); }

  var achieve=document.getElementById('pl-achieve').value;
  var note=(document.getElementById('pl-note').value||'').trim();
  if(!_plannerItems.length && !note && plannerImgs.length===0){ toast('내용을 입력해 주세요'); return; }
  var today=plannerToday();
  var p={ items:_plannerItems.slice(), achieve:achieve, note:note, name:MY_NAME, at:new Date().toISOString() };
  if(plannerImgs.length) p.imgs=plannerImgs.slice();
  db.ref('class_planner/'+MY_KEY+'/'+today).set(p).then(function(){
    if(!PLANNERS[MY_KEY]) PLANNERS[MY_KEY]={};
    PLANNERS[MY_KEY][today]=p;
    plannerImgs=[]; _plannerItems=[]; _plannerPlace='학원';
    _plannerEditMode=false;
    notifyTelegram('📅 플래너 제출\n'+MY_NAME+' 학생 ('+today+')');
    toast('플래너를 제출했어요');
    renderMain();
  }).catch(function(){ toast('제출 실패. 다시 시도해 주세요'); });
}

var _plannerEditMode = false;
function editPlannerToday(){
  var today=plannerToday();
  var e=(PLANNERS[MY_KEY]||{})[today]||{};
  plannerImgs=(e.imgs||[]).slice();
  // 기존 항목 복원 (옛 구조면 단일 항목으로 변환)
  if(e.items && e.items.length){ _plannerItems = e.items.slice(); }
  else if(e.subject || e.amount){ _plannerItems = [{ place:'학원', subject:e.subject||'', amount:e.amount||'' }]; }
  else { _plannerItems = []; }
  _plannerPlace='학원';
  _plannerEditMode=true;
  renderMain();
  setTimeout(function(){ renderPlannerItems(); renderPlannerPreview(); },30);
}

// 관리자: 날짜별 제출 현황
var _plannerDate = null;
function renderPlannerAdmin(){
  var date = _plannerDate || plannerToday();
  // 현재 반 멤버 명단
  var members = (CLASSES[CURRENT_CLASS] && CLASSES[CURRENT_CLASS].members) ? CLASSES[CURRENT_CLASS].members : {};
  var memberKeys = Object.keys(members);

  var html = '<div class="post">';
  html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">';
  html += '<button class="icon-btn" onclick="movePlannerDate(-1)">‹</button>';
  html += '<input type="date" id="pl-adm-date" value="'+date+'" onchange="setPlannerDate(this.value)" style="padding:8px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--sans);">';
  html += '<button class="icon-btn" onclick="movePlannerDate(1)">›</button>';
  html += '</div>';

  if(!CURRENT_CLASS){ html+='<div style="font-size:13px;color:var(--muted)">반을 선택해 주세요.</div></div>'; document.getElementById('main').innerHTML+=html; return; }
  if(memberKeys.length===0){ html+='<div style="font-size:13px;color:var(--muted)">이 반에 학생이 없어요.</div></div>'; document.getElementById('main').innerHTML+=html; return; }

  var submitted=[], notYet=[];
  memberKeys.forEach(function(k){
    var p = PLANNERS[k] && PLANNERS[k][date];
    if(p) submitted.push({key:k, name:(members[k].name||k), p:p});
    else notYet.push(members[k].name||k);
  });
  html += '<div style="font-size:13px;color:var(--ink2);">제출 '+submitted.length+'명 · 미제출 '+notYet.length+'명</div>';
  html += '</div>';

  // 미제출
  if(notYet.length){
    html += '<div class="section-title" style="color:var(--gold);">미제출 ('+notYet.length+')</div>';
    html += '<div class="post" style="font-size:13.5px;color:var(--ink2);">'+notYet.map(esc).join(', ')+'</div>';
  }
  // 제출
  html += '<div class="section-title" style="color:var(--teal);">제출 ('+submitted.length+')</div>';
  if(!submitted.length){
    html += '<div class="empty">아직 제출한 학생이 없어요.</div>';
  } else {
    submitted.forEach(function(s){
      html += '<div class="post"><div style="font-weight:700;margin-bottom:6px;">'+esc(s.name)+'</div>'+plannerBody(s.p)+'</div>';
    });
  }
  document.getElementById('main').innerHTML += html;
}
function setPlannerDate(d){ _plannerDate=d; renderMain(); }
function movePlannerDate(delta){
  var base=(_plannerDate||plannerToday()).split('-');
  var d=new Date(parseInt(base[0],10), parseInt(base[1],10)-1, parseInt(base[2],10));
  d.setDate(d.getDate()+delta);
  _plannerDate=fmtDate(d);
  renderMain();
}

function onPickImgs(ev){

function renderPreview(){

  }

function removeImg(i){ uploadImgs.splice(i,1); renderPreview(); }
function removeFile(){ uploadFile=null; renderPreview(); }

function submitPost(type){
  var text=(document.getElementById('comp-text')||{}).value||'';
  text=text.trim();
  if(!text && uploadImgs.length===0 && !uploadFile){ toast('내용이나 사진을 입력해 주세요'); return; }
  var btn=document.getElementById('send-btn'); if(btn) btn.disabled=true;
  var id='p'+Date.now();
  var post={ uid:UID, author:MY_NAME, role:MY_ROLE, type:type, text:text, createdAt:new Date().toISOString() };
  if(uploadImgs.length) post.imgs=uploadImgs.slice();
  if(uploadFile) post.file={ name:uploadFile.name, url:uploadFile.url };
  db.ref('class_posts/'+CURRENT_CLASS+'/'+id).set(post).then(function(){
    // 학생이 질문을 올리면 선생님 텔레그램으로 알림
    if(type==='qna' && MY_ROLE!=='admin'){
      var className = (CLASSES[CURRENT_CLASS] && CLASSES[CURRENT_CLASS].name) ? CLASSES[CURRENT_CLASS].name : '';
      var preview = text ? (text.length>60 ? text.slice(0,60)+'…' : text) : '(사진 질문)';
      notifyTelegram('❓ 새 질문\n['+className+'] '+MY_NAME+' 학생\n\n'+preview);
    }
    uploadImgs=[]; uploadFile=null;
    var ta=document.getElementById('comp-text'); if(ta) ta.value='';
    toast(type==='feed'?'자료를 올렸어요':'질문을 올렸어요');
    renderMain();
  }).catch(function(e){ toast('전송 실패. 다시 시도해 주세요'); if(btn) btn.disabled=false; });
}

}

  var c=CLASSES[CURRENT_CLASS]; if(!c) return;
  var members=c.members||{};
  var html='';
  html+='<div class="vtabs">';
  html+='<div class="vtab" onclick="setTab(\'feed\')">📚 학습자료</div>';
  html+='<div class="vtab" onclick="setTab(\'qna\')">❓ 질문</div>';
  html+='<div class="vtab on" onclick="setTab(\'manage\')">⚙️ 반 관리</div>';
  html+='</div>';

  // 반 정보
  html+='<div class="adm-section"><h3>'+esc(c.name)+' <button class="mini-btn" style="background:var(--red);" onclick="deleteClass()">반 삭제</button></h3>';

  // 현재 반 학생
  html+='<div class="adm-section"><h3>이 반 학생</h3>';
  var memKeys=Object.keys(members);
  if(memKeys.length===0){ html+='<div style="font-size:13px;color:var(--muted);">아직 추가된 학생이 없어요.</div>'; }
  else {
    memKeys.forEach(function(k){
      html+='<div class="stu-row"><div class="nm">'+esc(members[k].name||k)+'</div>';
      html+='<button class="icon-btn" style="padding:5px 11px;" onclick="removeMember(\''+k+'\')">빼기</button></div>';
    });
  }
  html+='</div>';

  // 가입 신청한 학생 (반 미배정) — 어느 반에 넣을지 선택
  html+='<div class="adm-section"><h3>가입 신청 <span style="font-size:12px;color:var(--muted);font-weight:500;">반 배정 대기</span></h3>';
  var signKeys=Object.keys(SIGNUPS||{});
  if(signKeys.length===0){ html+='<div style="font-size:13px;color:var(--muted);">가입 신청한 학생이 없어요.<br>학생이 가입 신청하면 여기에 나타나요.</div>'; }
  else {
    var classIds=Object.keys(CLASSES);
    signKeys.forEach(function(k){
      var s=SIGNUPS[k];
      html+='<div style="border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;">';
      html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
      html+='<span style="font-weight:700;font-size:14px;">'+esc(s.name||k)+'</span>';
      html+='<button class="icon-btn" style="padding:4px 10px;" onclick="rejectSignup(\''+k+'\')">신청 삭제</button></div>';
      if(classIds.length===0){
        html+='<div style="font-size:12px;color:var(--muted);">먼저 반을 만들어 주세요.</div>';
      } else {
        html+='<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">넣을 반 선택:</div>';
        html+='<div style="display:flex;flex-wrap:wrap;gap:6px;">';
        classIds.forEach(function(cid){
          var inThis = CLASSES[cid].members && CLASSES[cid].members[k];
          if(inThis){
            html+='<span class="mini-btn" style="background:var(--cream2);color:var(--muted);cursor:default;">'+esc(CLASSES[cid].name)+' ✓</span>';
          } else {
            html+='<button class="mini-btn" onclick="assignToClass(\''+k+'\',\''+cid+'\')">'+esc(CLASSES[cid].name)+'</button>';
          }
        });
        html+='</div>';
      }
      html+='</div>';
    });
  }
  html+='</div>';

  document.getElementById('main').innerHTML=html;
}
// 가입 신청 학생을 특정 반에 배정 → 배정하면 신청 목록에서 자동 제거
function assignToClass(key, cid){
  var s=(SIGNUPS||{})[key]; if(!s) return;
  db.ref('class_classes/'+cid+'/members/'+key).set({ name:s.name, uid:s.uid }).then(function(){
    return db.ref('class_signups/'+key).remove();   // 배정 완료 → 신청 대기에서 제거
  }).then(function(){
    if(SIGNUPS) delete SIGNUPS[key];
    toast(s.name+' 학생을 '+CLASSES[cid].name+'에 넣었어요');
    loadAll(function(){ renderManage(); });
  });
}
// 가입 신청 삭제 (배정 끝났거나 거절)
function rejectSignup(key){
  if(!confirm('이 가입 신청을 목록에서 지울까요?\n(이미 반에 넣었다면 반에서 빠지지 않아요)')) return;
  db.ref('class_signups/'+key).remove().then(function(){
    if(SIGNUPS) delete SIGNUPS[key];
    toast('신청 목록에서 지웠어요');
    loadAll(function(){ renderManage(); });
  });
}
function removeMember(key){
  if(!confirm('이 학생을 반에서 빼시겠어요?')) return;
  db.ref('class_classes/'+CURRENT_CLASS+'/members/'+key).remove().then(function(){
    toast('빼냈어요');
    loadAll(function(){ renderManage(); });
  });
}
function deleteClass(){
  if(!confirm('이 반을 삭제할까요? 올라온 자료·질문도 함께 사라져요.')) return;
  var cid=CURRENT_CLASS;
  db.ref('class_classes/'+cid).remove();
  db.ref('class_posts/'+cid).remove().then(function(){
    toast('반을 삭제했어요'); CURRENT_CLASS=null; CUR_TAB='feed';
    loadAll(function(){ var l=myClasses(); CURRENT_CLASS=l.length?l[0].id:null; renderClassBar(); renderMain(); });
  });
}

// ===== 시험 D-day =====
var MY_EXAM = null;       // 'YYYY-MM-DD' 또는 null
var MY_EXAM_NAME = '';    // 시험 이름
function loadExamDate(cb){
  if(isAdmin){ if(cb) cb(); return; }  // 관리자는 D-day 없음
  db.ref('class_users/'+MY_KEY).once('value').then(function(snap){
    var u=snap.val()||{};
    MY_EXAM = u.examDate || null;
    MY_EXAM_NAME = u.examName || '';
    renderDdayBar();
    if(cb) cb();
  }).catch(function(){ if(cb) cb(); });
}
function dDayNum(dateStr){
  // 오늘과 시험일의 날짜 차이 (양수=남음, 0=당일, 음수=지남)
  var t=todayStr().split('-'), e=dateStr.split('-');
  var td=new Date(parseInt(t[0],10),parseInt(t[1],10)-1,parseInt(t[2],10));
  var ed=new Date(parseInt(e[0],10),parseInt(e[1],10)-1,parseInt(e[2],10));
  return Math.round((ed-td)/86400000);
}
function renderDdayBar(){
  var bar=document.getElementById('ddaybar');
  if(!bar) return;
  if(isAdmin){ bar.style.display='none'; return; }
  bar.style.display='block';
  if(!MY_EXAM){
    bar.innerHTML='<div style="background:var(--gold-soft);color:var(--gold);padding:9px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);">'
      +'<span>🎯 시험일을 설정하면 D-day가 표시돼요</span>'
      +'<button onclick="openExamSetup()" style="background:var(--gold);color:#fff;border:none;border-radius:20px;padding:5px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);">설정</button></div>';
    return;
  }
  var n=dDayNum(MY_EXAM);
  var examLabel = MY_EXAM_NAME ? esc(MY_EXAM_NAME) : '시험';
  var label, color='var(--teal)';
  if(n>0){ label=examLabel+'까지 D-'+n; }
  else if(n===0){ label='오늘이 '+examLabel+'! D-DAY'; color='var(--red)'; }
  else { label=examLabel+'이(가) 지났어요 (D+'+(-n)+')'; color='var(--muted)'; }
  bar.innerHTML='<div style="background:'+color+';color:#fff;padding:10px 16px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:space-between;">'
    +'<span>🎯 '+label+' <span style="font-weight:500;font-size:12px;opacity:.85;">('+MY_EXAM+')</span></span>'
    +'<button onclick="openExamSetup()" style="background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);">변경</button></div>';
}
function openExamSetup(){
  var h='<h3>시험 D-day 설정</h3>';
  h+='<div style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:12px;">시험 이름과 첫날을 입력하면 모든 화면 위에 D-day가 표시돼요.</div>';
  h+='<label style="font-size:12px;font-weight:700;">시험 이름</label>';
  h+='<input type="text" id="exam-name" class="fld" placeholder="예: 1학기 기말고사" value="'+esc(MY_EXAM_NAME||'')+'" style="margin-top:4px;">';
  h+='<label style="font-size:12px;font-weight:700;">시험 첫날</label>';
  h+='<input type="date" id="exam-date" class="fld" value="'+(MY_EXAM||'')+'" style="margin-top:4px;">';
  h+='<div style="display:flex;gap:8px;margin-top:6px;">';
  if(MY_EXAM){ h+='<button class="icon-btn" style="flex:1;color:var(--red);" onclick="clearExamDate()">삭제</button>'; }
  h+='<button class="icon-btn" style="flex:1;" onclick="closeModal()">취소</button>';
  h+='<button class="send-btn" style="flex:1;margin:0;" onclick="saveExamDate()">저장</button>';
  h+='</div>';
  openModal(h);
}
function saveExamDate(){
  var d=document.getElementById('exam-date').value;
  var nm=(document.getElementById('exam-name').value||'').trim();
  if(!d){ toast('시험 첫날을 선택해 주세요'); return; }
  db.ref('class_users/'+MY_KEY).update({ examDate:d, examName:nm }).then(function(){
    MY_EXAM=d; MY_EXAM_NAME=nm; closeModal(); renderDdayBar(); toast('시험일을 저장했어요');
  }).catch(function(){ toast('저장 실패. 다시 시도해 주세요'); });
}
function clearExamDate(){
  db.ref('class_users/'+MY_KEY).update({ examDate:null, examName:null }).then(function(){
    MY_EXAM=null; MY_EXAM_NAME=''; closeModal(); renderDdayBar(); toast('시험일을 삭제했어요');
  });
}

// ===== 시작 =====
loadAll(function(){
  var list=myClasses();
  // 학생은 첫 반 자동 진입, 관리자는 반 선택 화면을 먼저 보도록 자동선택 안 함
  if(!isAdmin && list.length){ CURRENT_CLASS=list[0].id; }
  renderClassBar();
  if(CURRENT_CLASS){ loadPosts(); } else { renderMain(); }
  startClassesLive();
  loadExamDate();
});
</script>
</body>
</html>
